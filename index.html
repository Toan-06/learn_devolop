<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Traffic practice - Hệ Thống Luyện Thi Bằng Lái Xe</title>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏍️</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #e74c3c;
            --primary-dark: #c0392b;
            --secondary: #3498db;
            --success: #27ae60;
            --warning: #f39c12;
            --danger: #e74c3c;
            --dark: #2c3e50;
            --light: #ecf0f1;
            --gray: #95a5a6;
            --gradient-primary: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            --gradient-secondary: linear-gradient(135deg, #3498db 0%, #2980b9 100%);
            --gradient-success: linear-gradient(135deg, #27ae60 0%, #2ecc71 100%);
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
            --shadow-sm: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: radial-gradient(rgba(232, 45, 45, 0.03) 1.5px, transparent 1.5px), linear-gradient(-45deg, #0a0b0e, #3cd98d, #1a96d4, #0f121a);
            background-size: 24px 24px, 400% 400%;
            animation: gradient-move 18s ease infinite;
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }

        .bg-animation span {
            position: absolute;
            display: block;
            width: 20px;
            height: 20px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.03), inset 0 2px 4px rgba(255, 255, 255, 0.15);
            animation: float 25s linear infinite;
            bottom: -150px;
            border-radius: 50%;
            backdrop-filter: blur(1px);
            -webkit-backdrop-filter: blur(1px);
        }

        .bg-animation span:nth-child(1) {
            left: 10%;
            width: 75px;
            height: 75px;
            animation-delay: 0s;
            animation-duration: 22s;
        }

        .bg-animation span:nth-child(2) {
            left: 20%;
            width: 30px;
            height: 30px;
            animation-delay: 3s;
            animation-duration: 15s;
        }

        .bg-animation span:nth-child(3) {
            left: 35%;
            width: 50px;
            height: 50px;
            animation-delay: 1s;
            animation-duration: 28s;
        }

        .bg-animation span:nth-child(4) {
            left: 50%;
            width: 65px;
            height: 65px;
            animation-delay: 5s;
            animation-duration: 19s;
        }

        .bg-animation span:nth-child(5) {
            left: 65%;
            width: 25px;
            height: 25px;
            animation-delay: 2s;
            animation-duration: 12s;
        }

        .bg-animation span:nth-child(6) {
            left: 75%;
            width: 80px;
            height: 80px;
            animation-delay: 4s;
            animation-duration: 32s;
        }

        .bg-animation span:nth-child(7) {
            left: 85%;
            width: 40px;
            height: 40px;
            animation-delay: 7s;
            animation-duration: 25s;
        }

        .bg-animation span:nth-child(8) {
            left: 95%;
            width: 55px;
            height: 55px;
            animation-delay: 0s;
            animation-duration: 20s;
        }

        .bg-animation span:nth-child(9) {
            left: 15%;
            width: 45px;
            height: 45px;
            animation-delay: 8s;
            animation-duration: 24s;
        }

        .bg-animation span:nth-child(10) {
            left: 45%;
            width: 35px;
            height: 35px;
            animation-delay: 10s;
            animation-duration: 18s;
        }

        .bg-animation span:nth-child(11) {
            left: 55%;
            width: 55px;
            height: 55px;
            animation-delay: 12s;
            animation-duration: 21s;
        }

        .bg-animation span:nth-child(12) {
            left: 70%;
            width: 85px;
            height: 85px;
            animation-delay: 6s;
            animation-duration: 30s;
        }

        .bg-animation span:nth-child(13) {
            left: 30%;
            width: 25px;
            height: 25px;
            animation-delay: 14s;
            animation-duration: 14s;
        }

        .bg-animation span:nth-child(14) {
            left: 80%;
            width: 50px;
            height: 50px;
            animation-delay: 9s;
            animation-duration: 26s;
        }

        .bg-animation span:nth-child(15) {
            left: 90%;
            width: 30px;
            height: 30px;
            animation-delay: 13s;
            animation-duration: 17s;
        }

        @keyframes float {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }

            100% {
                transform: translateY(-1000px) rotate(720deg);
                opacity: 0;
            }
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        /* PREMIUM HEADER DESIGN */
        .header {
            text-align: center;
            padding: 80px 0 40px;
            position: relative;
            z-index: 1;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .header.compact {
            padding: 15px 10px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 25px;
        }

        .app-logo {
            width: 170px;
            height: 170px;
            object-fit: contain;
            margin-bottom: 25px;
            cursor: pointer;
            filter: drop-shadow(0 15px 35px rgba(0, 242, 254, 0.35));
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            animation: float-logo 4s ease-in-out infinite;
        }

        .app-logo:hover {
            transform: scale(1.08) rotate(3deg);
            filter: drop-shadow(0 20px 45px rgba(0, 242, 254, 0.55));
        }

        .header.compact .app-logo {
            width: 55px;
            height: 55px;
            margin-bottom: 0;
            margin-right: 15px;
            filter: drop-shadow(0 4px 10px rgba(0, 242, 254, 0.25));
            animation: none;
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 4px 12px rgba(219, 39, 39, 0.3);
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .header h1:hover {
            transform: scale(1.02);
        }

        .header.compact h1 {
            font-size: 1.8rem;
            margin-bottom: 0;
            letter-spacing: 0.5px;
        }

        .header p {
            font-size: 1.25rem;
            color: #a5b4fc;
            font-weight: 600;
            margin-bottom: 30px;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .header.compact p {
            display: none;
        }

        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(0, 242, 254, 0.08);
            border: 1px solid rgba(0, 242, 254, 0.3);
            color: #00f2fe;
            font-weight: 700;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.15);
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .live-badge:hover {
            background: rgba(0, 242, 254, 0.15);
            border-color: rgba(0, 242, 254, 0.6);
            box-shadow: 0 6px 25px rgba(0, 242, 254, 0.3);
            transform: translateY(-2px);
        }

        .header.compact .live-badge {
            display: none;
        }

        .live-badge::before {
            content: '';
            width: 8px;
            height: 8px;
            background: #00f2fe;
            border-radius: 50%;
            display: inline-block;
            box-shadow: 0 0 10px #00f2fe;
            animation: pulse-dot 2s infinite;
        }

        @keyframes pulse-dot {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.4;
                transform: scale(1.3);
            }
        }

        @keyframes float-logo {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-12px);
            }
        }

        .card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.85) 0%, rgba(245, 247, 250, 0.75) 100%);
            background-image: radial-gradient(rgba(37, 99, 235, 0.04) 1px, transparent 1px);
            background-size: 16px 16px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.7);
            overflow: hidden;
            margin-bottom: 30px;
        }

        .start-screen {
            padding: 50px;
            text-align: center;
        }

        .start-screen .hero-icon {
            width: 150px;
            height: 150px;
            margin: 0 auto 30px;
            background: var(--gradient-primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: white;
            box-shadow: 0 20px 60px rgba(231, 76, 60, 0.4);
            animation: pulse-shadow 3s infinite;
        }

        @keyframes pulse-shadow {

            0%,
            100% {
                box-shadow: 0 20px 60px rgba(231, 76, 60, 0.4);
            }

            50% {
                box-shadow: 0 20px 80px rgba(231, 76, 60, 0.6);
            }
        }

        .start-screen h2 {
            font-size: 2rem;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 15px;
        }

        .start-screen .subtitle {
            color: var(--gray);
            font-size: 1.1rem;
            margin-bottom: 30px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-box {
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            padding: 20px;
            border-radius: 16px;
            text-align: center;
            transition: transform 0.3s;
        }

        .stat-box:hover {
            transform: translateY(-5px);
        }

        .stat-box i {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .stat-box:nth-child(1) i {
            color: var(--primary);
        }

        .stat-box:nth-child(2) i {
            color: var(--secondary);
        }

        .stat-box:nth-child(3) i {
            color: var(--success);
        }

        .stat-box:nth-child(4) i {
            color: var(--warning);
        }

        .stat-box .number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--dark);
        }

        .stat-box .label {
            color: var(--gray);
            font-size: 0.9rem;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            margin-bottom: 40px;
            text-align: left;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .feature-item i {
            width: 40px;
            height: 40px;
            background: var(--gradient-success);
            color: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .feature-item span {
            font-weight: 500;
            color: var(--dark);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 18px 50px;
            font-size: 1.2rem;
            font-weight: 600;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
        }

        .btn-primary {
            background: var(--gradient-primary);
            color: white;
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(231, 76, 60, 0.5);
        }

        .btn-secondary {
            background: var(--gradient-secondary);
            color: white;
            box-shadow: 0 10px 30px rgba(52, 152, 219, 0.4);
        }

        .quiz-header {
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .quiz-header .info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .quiz-header .badge-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.2);
            padding: 10px 20px;
            border-radius: 50px;
            font-weight: 600;
        }

        .timer.warning {
            color: #f39c12;
        }

        .timer.danger {
            color: #e74c3c;
            animation: blink 0.5s infinite;
        }

        @keyframes blink {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        .category-filter {
            padding: 20px 30px;
            background: #f8f9fa;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 1px solid #eee;
        }

        .cat-btn {
            padding: 10px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 50px;
            background: white;
            cursor: pointer;
            font-weight: 500;
            color: var(--dark);
            transition: all 0.3s;
            font-family: 'Be Vietnam Pro', sans-serif;
            font-size: 0.9rem;
        }

        .cat-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
        }

        .cat-btn.active {
            background: var(--gradient-primary);
            color: white;
            border-color: transparent;
        }

        .progress-section {
            padding: 20px 30px;
            background: white;
            border-bottom: 1px solid #eee;
        }

        .progress-bar {
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--gradient-success);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .question-section {
            padding: 40px 30px;
        }

        .question-category {
            display: inline-block;
            background: var(--gradient-secondary);
            color: white;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .question-image {
            width: 100%;
            max-width: 300px;
            margin: 0 auto 25px;
            display: block;
            border-radius: 16px;
            box-shadow: var(--shadow-sm);
            background: white;
            padding: 20px;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--dark);
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .option {
            display: flex;
            align-items: center;
            padding: 20px 25px;
            border: 3px solid #e0e0e0;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s;
            background: white;
        }

        .option:hover:not(.disabled) {
            border-color: var(--primary);
            background: #fff5f5;
            transform: translateX(10px);
        }

        .option.selected {
            border-color: var(--primary);
            background: var(--primary);
            color: white;
        }

        .option.correct {
            border-color: var(--success);
            background: var(--success);
            color: white;
        }

        .option.incorrect {
            border-color: var(--danger);
            background: var(--danger);
            color: white;
        }

        .option.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .option-letter {
            width: 45px;
            height: 45px;
            background: #f0f0f0;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            margin-right: 20px;
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .option.selected .option-letter,
        .option.correct .option-letter,
        .option.incorrect .option-letter {
            background: rgba(255, 255, 255, 0.3);
            color: white;
        }

        .option-text {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .explanation {
            margin-top: 30px;
            padding: 25px;
            background: linear-gradient(135deg, #e8f5e9 0%, #c8e6c9 100%);
            border-radius: 16px;
            border-left: 5px solid var(--success);
            display: none;
        }

        .explanation.show {
            display: block;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .explanation h4 {
            color: var(--success);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .explanation p {
            color: var(--dark);
            line-height: 1.7;
        }

        .quiz-footer {
            padding: 25px 30px;
            background: #f8f9fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #eee;
        }

        .nav-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Be Vietnam Pro', sans-serif;
        }

        .nav-btn.prev {
            background: #e0e0e0;
            color: var(--dark);
        }

        .nav-btn.prev:hover:not(:disabled) {
            background: #d0d0d0;
        }

        .nav-btn.next {
            background: var(--gradient-primary);
            color: white;
        }

        .nav-btn.next:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(231, 76, 60, 0.4);
        }

        .nav-btn.submit {
            background: var(--gradient-success);
            color: white;
        }

        .nav-btn.submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(39, 174, 96, 0.4);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result-screen {
            padding: 50px;
            text-align: center;
        }

        .result-icon {
            font-size: 8rem;
            margin-bottom: 30px;
            animation: bounceIn 0.5s;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }
        }

        .result-icon.pass {
            color: var(--success);
        }

        .result-icon.fail {
            color: var(--danger);
        }

        .result-screen h2 {
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        .result-screen h2.pass {
            color: var(--success);
        }

        .result-screen h2.fail {
            color: var(--danger);
        }

        .result-score {
            font-size: 4rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .result-score.pass {
            color: var(--success);
        }

        .result-score.fail {
            color: var(--danger);
        }

        .result-percent {
            font-size: 1.3rem;
            color: var(--gray);
            margin-bottom: 40px;
        }

        .result-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .result-stat {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 16px;
        }

        .result-stat i {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .result-stat.correct i {
            color: var(--success);
        }

        .result-stat.wrong i {
            color: var(--danger);
        }

        .result-stat.percent i {
            color: var(--secondary);
        }

        .result-stat .value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--dark);
        }

        .result-stat .label {
            color: var(--gray);
            font-size: 0.9rem;
        }

        .result-actions {
            display: flex;
            gap: 20px;
            justify-content: center;
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }

            .header {
                padding: 40px 0 20px;
            }

            .app-logo {
                width: 120px;
                height: 120px;
                margin-bottom: 15px;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .header p {
                font-size: 1.1rem;
                margin-bottom: 20px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .features {
                grid-template-columns: 1fr;
                gap: 12px;
            }

            .dashboard-container {

            content: '';

            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            transition: background 0.3s ease;

        .license-card:hover::before {

            opacity: 0.8;
            background: #f8fafc;
            border-color: #e2e8f0;

            { id: 2, question: "Làn đường là gì?", options: ["Là một phần của phần đường xe chạy được chia theo chiều dọc của đường, sử dụng cho xe chạy", "Là một phần của phần đường xe chạy được chia theo chiều dọc của đường, có đủ chiều rộng cho xe chạy an toàn", "Là đường cho xe ô tô chạy, dừng, đỗ an toàn"], correct: 1, category: "Luật giao thông", explain: "Làn đường là phần của phần đường xe chạy được chia theo chiều dọc, có đủ chiều rộng để đảm bảo phương tiện lưu thông an toàn." },
            { id: 3, question: "Khổ giới hạn của đường bộ được hiểu như thế nào là đúng?", options: ["Khổ giới hạn của đường bộ là khoảng trống có kích thước giới hạn về chiều rộng, chiều cao của đường bộ để các xe, bao gồm cả hàng hoá xếp trên xe đi qua được an toàn và được xác định theo quy chuẩn, tiêu chuẩn kỹ thuật của đường bộ", "Là khoảng trống có kích thước giới hạn về chiều rộng của đường, cầu, bến phà, hầm trên đường bộ để các xe kể cả hàng hóa xếp trên xe đi qua được an toàn", "Là khoảng trống có kích thước giới hạn về chiều cao của cầu, bến phà, hầm trên đường bộ để các xe đi qua được an toàn"], correct: 0, category: "Luật giao thông", explain: "Khổ giới hạn của đường bộ là khoảng trống có giới hạn về chiều rộng và chiều cao, nhằm đảm bảo các phương tiện đi qua được an toàn." },
            { id: 4, question: "Dải phân cách được lắp đặt để làm gì?", options: ["Để phân chia các làn đường dành cho xe cơ giới và xe thô sơ trên đường cao tốc", "Để phân chia phần đường xe chạy thành hai chiều riêng biệt hoặc để phân chia phần đường dành cho xe cơ giới và xe thô sơ hoặc của nhiều loại xe khác nhau trên cùng một chiều đường", "Để phân tách phần đường xe chạy và hành lang an toàn giao thông"], correct: 1, category: "Luật giao thông", explain: "Dải phân cách được lắp đặt nhằm tách biệt hai chiều xe chạy hoặc các loại phương tiện khác nhau trên cùng một chiều đường." },
            { id: 5, question: "Vạch kẻ đường là gì?", options: ["Là báo hiệu đường bộ để hỗ trợ cảnh báo nguy hiểm cho người tham gia giao thông đường bộ", "Là vạch chỉ sự phân chia làn đường, vị trí hoặc hướng đi, vị trí dừng lại", "Là báo hiệu cho người tham gia giao thông đường bộ về các thông tin của đường bộ", "Cả ba ý trên"], correct: 1, category: "Luật giao thông", explain: "Vạch kẻ đường là vạch chỉ sự phân chia làn đường, vị trí hoặc hướng đi, vị trí dừng lại nhằm đảm bảo trật tự và an toàn khi tham gia giao thông." },
            { id: 6, question: "Người điều khiển phương tiện tham gia giao thông đường bộ được hiểu như thế nào là đúng?", options: ["Là người điều khiển xe cơ giới, người điều khiển xe thô sơ, người điều khiển xe máy chuyên dùng", "Là người được giao nhiệm vụ hướng dẫn giao thông trên đường bộ", "Cả hai ý trên"], correct: 0, category: "Luật giao thông", explain: "Người điều khiển phương tiện tham gia giao thông là người lái xe, bao gồm người điều khiển xe cơ giới, xe thô sơ và xe máy chuyên dùng." },
            { id: 7, question: "Người lái xe được hiểu như thế nào là đúng?", options: ["Là người điều khiển xe cơ giới", "Là người điều khiển xe thô sơ", "Là người điều khiển xe máy chuyên dùng"], correct: 0, category: "Luật giao thông", explain: "Người điều khiển phương tiện có động cơ trên đường là người trực tiếp điều khiển xe cơ giới như ô tô, xe máy." },
            { id: 8, question: "Trong nhóm các phương tiện giao thông đường bộ dưới đây, nhóm phương tiện nào là xe cơ giới?", options: ["Xe ô tô; máy kéo; xe mô tô hai bánh; xe mô tô ba bánh; xe gắn máy; xe cơ giới dùng cho người khuyết tật và xe máy chuyên dùng; xe đạp, xe đạp máy, xe đạp điện", "Xe ô tô; rơ moóc được kéo bởi xe ô tô; sơ mi rơ moóc được kéo bởi ô tô đầu kéo; xe chở người bốn bánh có gắn động cơ; xe chở hàng bốn bánh có gắn động cơ; xe mô tô, xe gắn máy và các loại xe tương tự"], correct: 1, category: "Luật giao thông", explain: "Phương tiện có động cơ chạy bằng xăng hoặc điện gồm ô tô, mô tô, xe máy và các loại xe tương tự." },
            { id: 9, question: "Trong nhóm các phương tiện giao thông đường bộ dưới đây, nhóm phương tiện nào là xe thô sơ?", options: ["Xe đạp, xe đạp máy, xe đạp điện; xe xích lô; xe lăn dùng cho người khuyết tật; xe vật nuôi kéo và các loại xe tương tự", "Xe đạp (kể cả xe đạp máy, xe đạp điện), xe gắn máy, xe cơ giới dùng cho người khuyết tật và xe máy chuyên dùng", "Xe ô tô, máy kéo, rơ moóc hoặc sơ mi rơ moóc được kéo bởi xe ô tô, máy kéo"], correct: 0, category: "Luật giao thông", explain: "Phương tiện giao thông thô sơ không có động cơ, bao gồm xe đạp, xe đạp máy, xe đạp điện, xe xích lô, xe lăn dùng cho người khuyết tật, xe vật nuôi kéo." },
            { id: 10, question: "Phương tiện giao thông đường bộ gồm những loại nào?", options: ["Phương tiện giao thông cơ giới đường bộ", "Phương tiện giao thông thô sơ đường bộ, xe máy chuyên dùng và các loại xe tương tự", "Cả hai ý trên"], correct: 2, category: "Luật giao thông", explain: "Phương tiện giao thông đường bộ gồm tất cả các loại phương tiện cơ giới, thô sơ và xe máy chuyên dùng." },
            { id: 11, question: "Người tham gia giao thông đường bộ gồm những đối tượng nào?", options: ["Người điều khiển, người được chở trên phương tiện tham gia giao thông đường bộ", "Người điều khiển, dẫn dắt vật nuôi trên đường bộ; người đi bộ trên đường bộ", "Cả hai ý trên"], correct: 2, category: "Luật giao thông", explain: "Người tham gia giao thông gồm người sử dụng phương tiện, dẫn dắt vật nuôi và người đi bộ." },
            { id: 12, question: "Người điều khiển phương tiện tham gia giao thông đường bộ gồm những đối tượng nào dưới đây?", options: ["Người điều khiển xe cơ giới, người điều khiển xe thô sơ", "Người điều khiển xe máy chuyên dùng", "Cả hai ý trên"], correct: 2, category: "Luật giao thông", explain: "Người điều khiển phương tiện gồm cả xe cơ giới, xe thô sơ và xe máy chuyên dùng." },
            { id: 13, question: "Người điều khiển giao thông đường bộ được hiểu như thế nào là đúng?", options: ["Là người điều khiển phương tiện tham gia giao thông đường bộ", "Là Cảnh sát giao thông và người được giao nhiệm vụ hướng dẫn giao thông trên đường bộ", "Là người tham gia giao thông đường bộ"], correct: 1, category: "Luật giao thông", explain: "Người điều khiển giao thông là Cảnh sát giao thông hoặc người được giao nhiệm vụ hướng dẫn giao thông." },
            { id: 14, question: "Hành vi nào dưới đây bị nghiêm cấm?", options: ["Sử dụng xe đạp đ trên các tuyến quốc lộ", "Rải vật sắc nhọn, đổ chất gây trơn trượt trên đường bộ", "Cả hai ý trên"], correct: 2, category: "Luật giao thông", explain: "Gây nguy hiểm bằng cách rải đinh, dầu hay chất trơn trên đường là hành vi bị nghiêm cấm vì ảnh hưởng đến an toàn giao thông." },
            { id: 15, question: "Hành vi đưa xe cơ giới, xe máy chuyên dùng tham gia giao thông đường bộ nào dưới đây bị cấm?", options: ["Không có chứng nhận kiểm định an toàn kỹ thuật và bảo vệ môi trường", "Hết niên hạn sử dụng", "Cả hai ý trên"], correct: 2, category: "Luật giao thông", explain: "Xe không đảm bảo kỹ thuật hoặc quá hạn sử dụng bị cấm vì tiềm ẩn nguy cơ tai nạn cao." },
            { id: 16, question: "Tổ chức đua xe được phép thực hiện khi nào?", options: ["Trên đường phố không có người qua lại", "Được người dân ủng hộ", "Được cơ quan có thẩm quyền cấp phép"], correct: 2, category: "Luật giao thông", explain: "Chỉ được phép đua xe khi có sự cho phép của cơ quan chức năng nhằm đảm bảo an toàn." },
            { id: 17, question: "Hành vi đua xe trái phép bị xử lý như thế nào?", options: ["Chỉ bị nhắc nhở", "Tùy theo mức độ của hành vi vi phạm có thể bị xử lý hành chính hoặc xử lý hình sự"], correct: 1, category: "Luật giao thông", explain: "Đua xe trái phép sẽ bị phạt nặng tùy mức độ vi phạm có thể xử lý hành chính hoặc hình sự." },
            { id: 18, question: "Người điều khiển phương tiện tham gia giao thông đường bộ mà trong máu hoặc hơi thở có nồng độ cồn có bị nghiêm cấm không?", options: ["Bị nghiêm cấm", "Không bị nghiêm cấm", "Không bị nghiêm cấm, nếu nồng độ cồn trong máu ở mức nhẹ"], correct: 0, category: "Luật giao thông", explain: "Bị nghiêm cấm tuyệt đối khi trong người có nồng độ cồn vì làm giảm khả năng phản xạ, gây nguy hiểm." },
            { id: 19, question: "Theo Luật Phòng chống tác hại của rượu, bia, đối tượng nào dưới đây bị cấm sử dụng rượu, bia khi tham gia giao thông?", options: ["Người điều khiển xe ô tô, xe mô tô, xe đạp, xe gắn máy", "Người được chở trên xe cơ giới", "Cả hai ý trên"], correct: 0, category: "Luật giao thông", explain: "Người điều khiển mọi loại phương tiện đều bị cấm uống rượu bia nhằm đảm bảo tỉnh táo và an toàn." },
            { id: 20, question: "Hành vi giao xe ô tô, mô tô cho người nào sau đây tham gia giao thông đường bộ bị nghiêm cấm?", options: ["Người chưa đủ tuổi theo quy định", "Người không có giấy phép lái xe", "Người có giấy phép lái xe nhưng đã bị trừ hết 12 điểm", "Cả ba ý trên"], correct: 3, category: "Luật giao thông", explain: "Cấm giao xe cho người chưa đủ tuổi, không có hoặc bị trừ hết điểm bằng lái." },
            { id: 21, question: "Hành vi nào sau đây bị nghiêm cấm?", options: ["Điều khiển xe cơ giới lạng lách, đánh võng, rú ga liên tục khi tham gia giao thông trên đường", "Xúc phạm, đe dọa, cản trở, chống đối hoặc không chấp hành hiệu lệnh, hướng dẫn, yêu cầu kiểm tra, kiểm soát của người thi hành công vụ", "Cả hai ý trên"], correct: 2, category: "Luật giao thông", explain: "Cả hai hành vi đều bị nghiêm cấm vì gây nguy hiểm và cản trở trật tự giao thông." },
            { id: 22, question: "Các hành vi nào sau đây bị cấm đối với phương tiện tham gia giao thông đường bộ?", options: ["Cải tạo xe ô tô loại khác thành xe ô tô chở người phục vụ mục đích quốc phòng, an ninh", "Cải tạo trái phép; cố ý can thiệp làm sai lệch chỉ số trên đồng hồ báo quãng đường đã chạy; cắt, hàn, tẩy xóa, đục sửa, đóng lại trái phép số khung, số động cơ"], correct: 1, category: "Luật giao thông", explain: "Cấm can thiệp trái phép vào thông số kỹ thuật của xe như chỉnh sửa đồng hồ km, số khung, số máy." },
            { id: 23, question: "Hành vi nào sau đây bị cấm?", options: ["Lắp đặt, sử dụng thiết bị âm thanh, ánh sáng trên xe cơ giới, xe máy chuyên dùng gây mất trật tự, an toàn giao thông", "Cản trở người, phương tiện tham gia giao thông trên đường bộ; ném gạch, đất, đá, cát hoặc vật thể khác vào người, phương tiện", "Cả hai ý trên"], correct: 2, category: "Luật giao thông", explain: "Cả hai hành vi đều vi phạm vì gây nguy hiểm và mất trật tự giao thông." },
            { id: 24, question: "Việc sản xuất, sử dụng, mua, bán trái phép biển số xe có bị nghiêm cấm hay không?", options: ["Không bị nghiêm cấm", "Bị nghiêm cấm", "Bị nghiêm cấm tùy trường hợp"], correct: 1, category: "Luật giao thông", explain: "Bị nghiêm cấm vì gây giả mạo, gian lận trong quản lý phương tiện." },
            { id: 25, question: "Khi điều khiển phương tiện tham gia giao thông, những hành vi nào dưới đây bị nghiêm cấm?", options: ["Thay đổi tốc độ của xe nhiều lần", "Điều khiển phương tiện sau 23 giờ trong ngày", "Lạng lách, đánh võng, rú ga liên tục"], correct: 2, category: "Luật giao thông", explain: "Lái xe lạng lách, đánh võng, rú ga gây nguy hiểm bị cấm." },
            { id: 26, question: "Có bao nhiêu nhóm biển báo hiệu đường bộ?", options: ["Ba nhóm: Biển báo cấm, biển báo nguy hiểm và biển hiệu lệnh", "Bốn nhóm: Biển báo cấm, biển báo nguy hiểm, biển hiệu lệnh và biển phụ", "Năm nhóm: Biển báo cấm, biển báo nguy hiểm, biển hiệu lệnh, biển chỉ dẫn, biển phụ"], correct: 2, category: "Luật giao thông", explain: "Có 5 nhóm biển báo gồm cấm, nguy hiểm, hiệu lệnh, chỉ dẫn, phụ giúp người tham gia giao thông nhận biết và chấp hành đúng luật." },
            { id: 27, question: "Tại nơi có vạch kẻ đường hoặc tại nơi mà người đi bộ, xe lăn của người khuyết tật đang qua đường, người điều khiển phương tiện tham gia giao thông phải thực hiện như thế nào?", options: ["Giảm tốc độ và nhường đường cho người đi bộ, xe lăn của người khuyết tật qua đường đảm bảo an toàn", "Quan sát, giảm tốc độ hoặc dừng lại để bảo đảm an toàn cho người đi bộ, xe lăn của người khuyết tật qua đường", "Quan sát, tăng tốc độ và điều khiển phương tiện nhanh chóng đi qua"], correct: 1, category: "Luật giao thông", explain: "Phải giảm tốc độ hoặc dừng lại để nhường đường an toàn nhằm đảm bảo người đi bộ, xe lăn sang đường không bị nguy hiểm." },
            { id: 28, question: "Người điều khiển xe mô tô phải quan sát, giảm tốc độ hoặc dừng lại để bảo đảm an toàn trong các trường hợp nào dưới đây?", options: ["Đường hẹp, đường vòng, đường quanh co, đường đèo, dốc", "Nơi cầu, cống hẹp, đập tràn, đường ngầm, hầm chui, hầm đường bộ", "Trời mưa, gió, sương, khói, bụi, mặt đường trơn trượt, lầy lội, có nhiều đất đá, vật liệu rơi vãi ảnh hưởng đến an toàn giao thông", "Cả ba ý trên"], correct: 3, category: "Luật giao thông", explain: "Phải giảm tốc độ hoặc dừng lại trong các điều kiện đường nguy hiểm như đường hẹp, đèo dốc, mưa gió, để đảm bảo an toàn." },
            { id: 29, question: "Khi gặp hiệu lệnh điều khiển của Cảnh sát giao thông như hình dưới đây thì người tham gia giao thông đường bộ phải đi như thế nào là đúng quy tắc giao thông?", options: ["Người tham gia giao thông đường bộ ở các hướng phải dừng lại", "Người tham gia giao thông đường bộ ở các hướng được đi theo chiều gậy chỉ của Cảnh sát giao thông", "Người tham gia giao thông đường bộ ở phía trước và phía sau người điều khiển được đi tất cả các hướng; người tham gia giao thông đường bộ ở phía bên phải và phía bên trái người điều khiển phải dừng lại", "Người tham gia giao thông đường bộ ở phía trước và phía sau người điều khiển phải dừng lại; người tham gia giao thông đường bộ ở phía bên phải và phía bên trái người điều khiển được đi tất cả các hướng"], correct: 3, category: "Luật giao thông", explain: "Khi Cảnh sát giao thông giơ 2 tay ngang, người ở trước và sau phải dừng, người bên trái và phải được phép đi." },
            { id: 30, question: "Khi gặp hiệu lệnh điều khiển của Cảnh sát giao thông như hình dưới đây thì người tham gia giao thông đường bộ phải đi như thế nào là đúng quy tắc giao thông?", options: ["Người tham gia giao thông đường bộ ở phía sau Cảnh sát giao thông được đi, các hướng khác phải dừng lại", "Người tham gia giao thông đường bộ ở tất cả các hướng phải dừng lại, trừ các xe đã ở trong khu vực giao nhau", "Người tham gia giao thông đường bộ ở phía trước Cảnh sát giao thông phải dừng lại, các hướng khác được đi"], correct: 1, category: "Luật giao thông", explain: "Khi Cảnh sát giao thông giơ tay lên, tất cả các hướng phải dừng lại, trừ các xe đã ở trong khu vực giao nhau." },
            { id: 31, question: "Khi hiệu lệnh của người điều khiển giao thông trái với tín hiệu đèn giao thông hoặc biển báo hiệu đường bộ thì người tham gia giao thông đường bộ phải chấp hành báo hiệu nào dưới đây?", options: ["Theo hiệu lệnh của người điều khiển giao thông", "Theo tín hiệu đèn giao thông", "Theo biển báo hiệu đường bộ"], correct: 0, category: "Luật giao thông", explain: "Phải tuân theo hiệu lệnh của người điều khiển vì họ trực tiếp điều phối giao thông." },
            { id: 32, question: "Khi ở một vị trí vừa có biển báo hiệu đặt cố định vừa có biển báo hiệu tạm thời mà hai biển có ý nghĩa khác nhau, người tham gia giao thông đường bộ phải chấp hành hiệu lệnh của biển báo hiệu nào?", options: ["Biển báo hiệu đặt cố định", "Biển báo hiệu tạm thời", "Theo quyết định của người tham gia giao thông nhưng phải bảo đảm an toàn"], correct: 1, category: "Luật giao thông", explain: "Phải chấp hành biển báo hiệu tạm thời vì chúng được đặt ra để xử lý tình huống phát sinh như sửa chữa, tai nạn." },
            { id: 33, question: "Tại nơi đường giao nhau, khi đèn điều khiển giao thông có tín hiệu màu vàng, người điều khiển phương tiện tham gia giao thông phải chấp hành như thế nào là đúng quy tắc giao thông?", options: ["Dừng lại trước vạch dừng; trường hợp đang đi trên vạch dừng hoặc đã đi qua vạch dừng mà tín hiệu đèn màu vàng thì được đi tiếp; trường hợp tín hiệu đèn màu vàng nhấp nháy, người điều khiển phương tiện được đi nhưng phải quan sát, giảm tốc độ hoặc dừng lại nhường đường", "Tăng tốc độ nhanh chóng vượt qua nút giao", "Quan sát, giảm tốc độ, từ từ vượt qua nút giao"], correct: 0, category: "Luật giao thông", explain: "Phải dừng trước vạch hoặc đi tiếp nếu đã vượt để đảm bảo tuân thủ tín hiệu đèn vàng." },
            { id: 34, question: "Người lái xe trên đường cần chấp hành quy định về tốc độ tối đa như thế nào?", options: ["Chỉ lớn hơn tốc độ tối đa cho phép khi đường vắng", "Chỉ lớn hơn tốc độ tối đa cho phép khi vào ban đêm", "Không vượt quá tốc độ tối đa cho phép"], correct: 2, category: "Luật giao thông", explain: "Phải luôn tuân thủ đúng tốc độ tối đa cho phép để đảm bảo an toàn." },
            { id: 35, question: "Phương tiện tham gia giao thông đường bộ di chuyển với tốc độ thấp hơn phải đi như thế nào?", options: ["Đi về bên trái theo chiều đi của mình", "Đi về bên phải theo chiều đi của mình", "Đi ở bất cứ bên nào nhưng phải bấm đèn cảnh báo nguy hiểm"], correct: 1, category: "Luật giao thông", explain: "Phải đi sát bên phải theo chiều đi của mình để tạo lối thoáng cho xe chạy nhanh vượt lên an toàn." },
            { id: 36, question: "Trên một chiều đường có vạch kẻ phân làn đường, người lái xe cơ giới, xe máy chuyên dùng phải điều khiển xe đi trên làn đường nào?", options: ["Đi trên làn đường bên phải trong cùng", "Đi trên làn đường bên trái", "Đi ở bất cứ làn nào nhưng phải bảo đảm tốc độ cho phép"], correct: 1, category: "Luật giao thông", explain: "Phải đi đúng làn đường bên trái theo quy định để đảm bảo phân luồng rõ ràng." },
            { id: 37, question: "Người lái xe phải giảm tốc độ, có tín hiệu rẽ phải và đi sát về bên phải của phần đường xe chạy trong các trường hợp nào dưới đây?", options: ["Khi xe chạy phía trước có tín hiệu vượt xe khác", "Khi phía trước có xe chạy ngược chiều", "Khi xe sau xin vượt nếu đủ điều kiện an toàn", "Khi xe sau có tín hiệu vượt bên phải"], correct: 2, category: "Luật giao thông", explain: "Phải giảm tốc độ, nhường đường an toàn để xe sau vượt đúng luật." },
            { id: 38, question: "Vượt xe là gì?", options: ["Là tình huống giao thông trên đường mà mỗi chiều đường xe chạy chỉ có một làn đường dành cho xe cơ giới, xe đi phía sau di chuyển sang bên trái để di chuyển lên trước xe phía trước", "Là tình huống giao thông trên đường có từ hai làn đường dành cho xe cơ giới cùng chiều trở lên được phân biệt bằng vạch kẻ đường, xe đi phía sau di chuyển lên trước xe phía trước theo quy tắc sử dụng làn đường"], correct: 0, category: "Luật giao thông", explain: "Vượt xe là hành động điều khiển xe vượt lên trước xe khác trên đường một chiều có một làn xe." },
            { id: 39, question: "Người lái xe được phép vượt xe trên cầu hẹp có một làn đường, đường cong có tầm nhìn bị hạn chế hay không?", options: ["Được phép vượt khi đường vắng", "Không được phép vượt", "Được phép vượt khi có việc gấp"], correct: 1, category: "Luật giao thông", explain: "Tuyệt đối không vượt xe trên cầu hẹp hay đường cong vì tầm nhìn hạn chế dễ gây tai nạn nghiêm trọng." },
            { id: 40, question: "Muốn vượt xe phía trước, người lái xe mô tô phải có tín hiệu như thế nào dưới đây để bảo đảm an toàn?", options: ["Bật đèn tín hiệu báo rẽ và đi từ bên trái", "Bật còi và đi từ bên phải", "Tăng tốc độ nhanh và đi giữa hai xe"], correct: 0, category: "Luật giao thông", explain: "Phải bật tín hiệu báo rẽ và vượt từ bên trái theo quy tắc giao thông." },
            { id: 41, question: "Người lái xe sử dụng đèn như thế nào khi đi trên các đoạn đường qua khu đông dân cư có hệ thống chiếu sáng đang hoạt động?", options: ["Bật đèn pha chiếu xa", "Bật đèn chiếu gần", "Tắt đèn chiếu sáng"], correct: 1, category: "Luật giao thông", explain: "Khi có hệ thống chiếu sáng, chỉ cần bật đèn chiếu gần để tiết kiệm năng lượng và không gây chói mắt." },
            { id: 42, question: "Khi điều khiển phương tiện tham gia giao thông, hành vi nào sau đây bị cấm?", options: ["Sử dụng điện thoại khi dừng xe", "Sử dụng điện thoại khi đang lái xe để nhắn tin, gọi điện", "Cả hai ý trên"], correct: 2, category: "Luật giao thông", explain: "Sử dụng điện thoại khi đang lái xe gây mất tập trung và nguy hiểm." },
            { id: 43, question: "Người lái xe không được vượt xe khác khi gặp trường hợp nào dưới đây?", options: ["Trên đường cao tốc", "Tại nơi có biển báo cấm vượt", "Tại đường cong tầm nhìn bị hạn chế", "Cả ba ý trên"], correct: 3, category: "Luật giao thông", explain: "Không được vượt xe trên đường cao tốc, nơi có biển cấm vượt, đường cong hoặc tầm nhìn hạn chế." },
            { id: 44, question: "Nơi nào cấm quay đầu xe?", options: ["Tại nơi có biển báo cấm quay đầu", "Tại phần đường cấm dừng, đỗ xe", "Tại đoạn đường cong hoặc gần đỉnh dốc tầm nhìn bị hạn chế", "Cả ba ý trên"], correct: 3, category: "Luật giao thông", explain: "Cấm quay đầu tại nơi có biển cấm, nơi cấm dừng đỗ, đường cong hoặc gần đỉnh dốc có tầm nhìn hạn chế." },
            { id: 45, question: "Trước khi cho xe chuyển hướng, người lái xe phải làm gì để bảo đảm an toàn giao thông?", options: ["Bật tín hiệu báo rẽ và quan sát các hướng", "Tăng tốc độ để nhanh chóng chuyển hướng", "Bấm còi để cảnh báo các xe khác"], correct: 0, category: "Luật giao thông", explain: "Phải bật tín hiệu báo rẽ và quan sát kỹ các hướng trước khi chuyển hướng." },
            { id: 46, question: "Khi chuyển làn đường, người lái xe phải bật đèn tín hiệu báo rẽ như thế nào là đúng quy tắc giao thông?", options: ["Bật tín hiệu báo rẽ phải khi chuyển sang làn phải, báo trái khi chuyển sang làn trái", "Bật đèn khẩn cấp", "Không cần bật tín hiệu"], correct: 0, category: "Luật giao thông", explain: "Phải bật tín hiệu báo rẽ đúng hướng khi chuyển làn đường để cảnh báo các xe khác." },
            { id: 47, question: "Người điều khiển phương tiện tham gia giao thông không được dừng xe, đỗ xe ở những vị trí nào sau đây?", options: ["Trên phần đường xe chạy", "Trên cầu, trong hầm đường bộ", "Trước và trong phạm vi 5m tính từ điểm giao nhau", "Cả ba ý trên"], correct: 3, category: "Luật giao thông", explain: "Cấm dừng, đỗ xe trên phần đường xe chạy, cầu, hầm, gần giao lộ để đảm bảo an toàn giao thông." },
            { id: 48, question: "Người lái xe cơ giới phải giảm tốc độ và nhường đường cho người đi bộ trong trường hợp nào dưới đây?", options: ["Khi đi qua khu vực trường học", "Khi có người đi bộ đang băng qua đường", "Khi có vạch kẻ đường cho người đi bộ", "Cả ba ý trên"], correct: 3, category: "Luật giao thông", explain: "Phải nhường đường cho người đi bộ khi qua trường học, nơi có người băng qua đường hoặc vạch kẻ đường." },
            { id: 49, question: "Khi có xe ưu tiên đi qua, người tham gia giao thông phải làm gì?", options: ["Tăng tốc độ để đi trước", "Giảm tốc độ, đi sát lề đường bên phải hoặc dừng lại nhường đường", "Tiếp tục đi với tốc độ bình thường"], correct: 1, category: "Luật giao thông", explain: "Phải giảm tốc độ, đi sát lề đường hoặc dừng lại để nhường đường cho xe ưu tiên." },
            { id: 50, question: "Khi gặp xe chữa cháy, xe cứu thương đang làm nhiệm vụ, người tham gia giao thông phải xử lý như thế nào?", options: ["Tiếp tục đi như bình thường", "Nhường đường bằng cách đi sát lề đường bên phải và dừng lại nếu cần", "Bấm còi để phản đối"], correct: 1, category: "Luật giao thông", explain: "Phải nhường đường cho xe ưu tiên như xe chữa cháy, xe cứu thương đang làm nhiệm vụ." },
            { id: 51, question: "Khi tới đường ngang không có người gác, chắn đường bộ, chuông, đèn tín hiệu, người tham gia giao thông đường bộ phải làm gì để bảo đảm an toàn?", options: ["Dừng lại về bên phải đường của mình, trước vạch dừng xe và quan sát hai phía, khi không có phương tiện giao thông đường sắt tới mới được đi qua", "Quan sát hai phía, khi không có phương tiện giao thông đường sắt tới thì nhanh chóng đi qua", "Dừng lại khoảng cách tối thiểu 3 mét tính từ ray đường sắt gần nhất"], correct: 0, category: "Luật giao thông", explain: "Phải dừng lại, quan sát hai phía, chỉ khi không có tàu mới được đi qua đường ngang." },
            { id: 52, question: "Tại đường ngang, cầu chung đường sắt, khi có hiệu lệnh của nhân viên gác chắn, đèn đỏ sáng nhấp nháy, chuông kêu, chắn đường bộ đang dịch chuyển hoặc đã đóng, người tham gia giao thông đường bộ phải làm gì để bảo đảm an toàn?", options: ["Dừng lại về bên trái đường của mình, trước vạch dừng xe", "Dừng lại giữa đường của mình, trước vạch dừng xe", "Dừng lại về bên phải đường của mình, trước vạch dừng xe"], correct: 2, category: "Luật giao thông", explain: "Phải dừng lại về bên phải đường, trước vạch dừng xe khi có tín hiệu đường sắt." },
            { id: 53, question: "Người tham gia giao thông đường bộ phải dừng lại về bên phải đường của mình trước vạch dừng xe tại đường ngang, cầu chung đường sắt khi có báo hiệu nào dưới đây?", options: ["Hiệu lệnh của nhân viên gác chắn", "Đèn đỏ sáng nhấp nháy, chuông kêu", "Chắn đường bộ đang dịch chuyển hoặc đã đóng", "Cả ba ý trên"], correct: 3, category: "Luật giao thông", explain: "Phải dừng lại khi có bất kỳ báo hiệu nào của đường sắt như hiệu lệnh gác chắn, đèn đỏ, chuông kêu hoặc chắn đường đóng/mở." },
            { id: 54, question: "Người điều khiển phương tiện tham gia giao thông trong hầm đường bộ ngoài việc phải tuân thủ các quy tắc giao thông còn phải thực hiện những quy định nào dưới đây?", options: ["Xe cơ giới, xe máy chuyên dùng phải bật đèn chiếu gần; xe thô sơ phải bật đèn hoặc có vật phát sáng báo hiệu; không dừng xe, đỗ xe trong hầm đường bộ; trường hợp gặp sự cố phải đưa xe vào vị trí dừng xe khẩn cấp và báo hiệu", "Xe cơ giới, xe máy chuyên dùng phải bật đèn chiếu xa; được dừng xe, đỗ xe khi cần thiết", "Phải cho xe chạy trên một làn đường và chỉ chuyển làn ở nơi được phép; được quay đầu xe, lùi xe khi cần thiết"], correct: 0, category: "Luật giao thông", explain: "Trong hầm phải bật đèn chiếu gần, không dừng đỗ xe, trường hợp sự cố phải đưa xe vào vị trí khẩn cấp và báo hiệu." },
            { id: 55, question: "Người lái xe được phép vượt xe khác về bên phải trong trường hợp nào dưới đây?", options: ["Xe phía trước có tín hiệu rẽ trái hoặc đang rẽ trái hoặc khi xe chuyên dùng đang làm việc trên đường mà không thể vượt bên trái", "Xe phía trước đang đi sát lề đường bên trái", "Cả hai ý trên"], correct: 2, category: "Luật giao thông", explain: "Được phép vượt bên phải khi xe trước rẽ trái hoặc đang làm việc trên đường mà không thể vượt trái." },
            { id: 56, question: "Khi có xe xin vượt, người lái xe mô tô xử lý như thế nào nếu đủ điều kiện an toàn cho xe phía sau vượt?", options: ["Giảm tốc độ, có tín hiệu rẽ phải để báo hiệu cho người điều khiển phương tiện phía sau biết được vượt và đi sát về bên phải cho đến khi xe sau đã vượt qua, không được cản trở đối với xe xin vượt", "Lái xe vào lề đường bên trái và giảm tốc độ để xe phía sau vượt qua", "Tăng tốc độ, đi sát về bên phải cho đến khi xe sau đã vượt qua"], correct: 0, category: "Luật giao thông", explain: "Phải giảm tốc độ, nhường đường bên phải để xe sau vượt an toàn, không được cản trở." },
            { id: 57, question: "Những trường hợp nào dưới đây không được đi trên đường cao tốc, trừ người, phương tiện giao thông đường bộ và thiết bị phục vụ việc quản lý, bảo trì đường cao tốc?", options: ["Xe máy chuyên dùng có tốc độ thiết kế nhỏ hơn tốc độ tối thiểu quy định đối với đường cao tốc, xe chở người bốn bánh có gắn động cơ, xe chở hàng bốn bánh có gắn động cơ, xe mô tô, xe gắn máy, các loại xe tương tự xe mô tô, xe gắn máy, xe thô sơ, người đi bộ", "Xe máy chuyên dùng có tốc độ thiết kế lớn hơn tốc độ tối thiểu quy định đối với đường cao tốc", "Xe ô tô và xe máy chuyên dùng có tốc độ thiết kế lớn hơn 80 km/h"], correct: 0, category: "Luật giao thông", explain: "Xe máy, xe gắn máy, xe thô sơ và người đi bộ không được đi trên đường cao tốc." },
            { id: 58, question: "Theo quy định về độ tuổi, người đủ bao nhiêu tuổi trở lên thì được cấp giấy phép lái xe mô tô hai bánh có dung tích xi lanh đến 125 cm3 và xe ô tô chở người đến 8 chỗ?", options: ["16 tuổi", "17 tuổi", "18 tuổi"], correct: 2, category: "Luật giao thông", explain: "Theo quy định, người đủ 18 tuổi trở lên được cấp giấy phép lái xe mô tô và ô tô." },
            { id: 59, question: "Người đủ 16 tuổi đến dưới 18 tuổi chỉ được điều khiển các loại xe nào dưới đây?", options: ["Xe mô tô hai bánh có dung tích xi-lanh đến 125 cm3", "Xe gắn máy", "Xe ô tô chở người đến 08 chỗ"], correct: 1, category: "Luật giao thông", explain: "Người từ 16 đến dưới 18 tuổi chỉ được điều khiển xe gắn máy theo quy định." },
            { id: 60, question: "Người có Giấy phép lái xe mô tô hạng A1 không được phép điều khiển loại xe nào dưới đây?", options: ["Xe mô tô hai bánh có dung tích xi-lanh 125 cm3 hoặc có công suất động cơ điện đến 11 kW", "Xe mô tô ba bánh", "Cả hai ý trên"], correct: 2, category: "Luật giao thông", explain: "GPLX A1 chỉ cho phép điều khiển xe mô tô hai bánh, không được đi xe ba bánh." },
            { id: 61, question: "Người có Giấy phép lái xe mô tô hạng A1 được cấp sau ngày 01/01/2025 được phép điều khiển loại xe nào dưới đây?", options: ["Xe mô tô hai bánh có dung tích xi-lanh đến 125 cm3 hoặc có công suất động cơ điện đến 11 kW", "Xe mô tô ba bánh", "Cả hai ý trên"], correct: 0, category: "Luật giao thông", explain: "GPLX A1 cấp sau 01/01/2025 cho phép điều khiển xe mô tô hai bánh đến 125cm3 hoặc công suất điện đến 11kW." },
            { id: 62, question: "Người có Giấy phép lái xe mô tô hạng A được phép điều khiển loại xe nào dưới đây?", options: ["Xe mô tô hai bánh có dung tích xi-lanh đến 125 cm3 hoặc có công suất động cơ điện đến 11 kW", "Xe mô tô hai bánh có dung tích xi-lanh trên 125 cm3 hoặc có công suất động cơ điện trên 11 kW", "Cả hai ý trên"], correct: 2, category: "Luật giao thông", explain: "GPLX hạng A cho phép điều khiển mọi loại xe mô tô hai bánh kể cả trên 125cm3." },
            { id: 63, question: "Người lái xe khi tham gia giao thông đường bộ phải đảm bảo các điều kiện nào dưới đây?", options: ["Phải đủ tuổi, sức khỏe theo quy định; có giấy phép lái xe đang còn điểm, còn hiệu lực phù hợp với loại xe đang điều khiển", "Phải là người đứng tên trong đăng ký xe", "Cả hai ý trên"], correct: 0, category: "Luật giao thông", explain: "Người lái xe phải đủ tuổi, sức khỏe và có GPLX phù hợp với loại xe điều khiển." },
            { id: 64, question: "Khi tham gia giao thông đường bộ, người lái xe phải mang theo các giấy tờ gì?", options: ["Chứng nhận đăng ký xe hoặc bản sao có chứng thực kèm bản gốc giấy tờ xác nhận của tổ chức tín dụng trong trường hợp xe đang thế chấp", "Giấy phép lái xe phù hợp; chứng nhận kiểm định an toàn kỹ thuật; chứng nhận bảo hiểm bắt buộc trách nhiệm dân sự của chủ xe cơ giới", "Cả ba ý trên"], correct: 2, category: "Luật giao thông", explain: "Phải mang đủ giấy tờ gồm GPLX, đăng ký xe, kiểm định và bảo hiểm khi tham gia giao thông." },
            { id: 65, question: "Người có giấy phép lái xe chưa bị trừ hết 12 điểm, được phục hồi điểm giấy phép lái xe trong trường hợp nào sau đây?", options: ["Không được phục hồi", "Được phục hồi đủ 12 điểm, nếu không bị trừ điểm trong thời gian 12 tháng từ ngày bị trừ điểm gần nhất"], correct: 1, category: "Luật giao thông", explain: "Được phục hồi đủ 12 điểm nếu không vi phạm trong 12 tháng kể từ ngày bị trừ điểm gần nhất." },
            { id: 66, question: "Người có giấy phép lái xe đã bị trừ hết điểm phải làm gì để phục hồi điểm giấy phép lái xe?", options: ["Không vi phạm pháp luật trật tự, an toàn giao thông đường bộ trong thời gian 12 tháng kể từ ngày bị trừ hết điểm", "Sau thời hạn ít nhất là 06 tháng kể từ ngày bị trừ hết điểm, tham gia kiểm tra nội dung kiến thức pháp luật và đạt yêu cầu thì được phục hồi đủ 12 điểm", "Cả hai ý trên"], correct: 2, category: "Luật giao thông", explain: "Phải không vi phạm 12 tháng hoặc sau 06 tháng tham gia kiểm tra kiến thức và đạt yêu cầu." },
            { id: 67, question: "Trách nhiệm của tổ chức, cá nhân đứng tên trong giấy chứng nhận đăng ký xe khi chưa thực hiện thu hồi chứng nhận đăng ký xe, biển số xe được quy định như thế nào?", options: ["Tiếp tục chịu trách nhiệm của chủ xe", "Không chịu trách nhiệm sau khi đã chuyển nhượng, trao đổi, tặng, cho"], correct: 0, category: "Luật giao thông", explain: "Người đứng tên đăng ký xe vẫn tiếp tục chịu trách nhiệm của chủ xe cho đến khi hoàn tất thủ tục thu hồi." },
            { id: 68, question: "Trên đường bộ, trong khu vực đông dân cư, đường đôi hoặc đường một chiều có từ hai làn xe cơ giới trở lên, xe mô tô hai bánh, ô tô chở người đến 28 chỗ không kể chỗ của người lái xe tham gia giao thông với tốc độ khai thác tối đa cho phép là bao nhiêu?", options: ["60 km/h", "50 km/h", "40 km/h"], correct: 0, category: "Luật giao thông", explain: "Trong khu vực đông dân cư, đường đôi từ 2 làn trở lên, tốc độ tối đa cho phép là 60 km/h." },
            { id: 69, question: "Trên đường bộ (trừ đường cao tốc) trong khu vực đông dân cư, đường hai chiều hoặc đường một chiều có một làn xe cơ giới, xe mô tô hai bánh, ô tô chở người đến 28 chỗ không kể chỗ của người lái xe tham gia giao thông với tốc độ khai thác tối đa cho phép là bao nhiêu?", options: ["60 km/h", "50 km/h", "40 km/h"], correct: 1, category: "Luật giao thông", explain: "Đường một làn trong khu vực đông dân cư có tốc độ tối đa cho phép là 50 km/h." },
            { id: 70, question: "Trên đường bộ ngoài khu vực đông dân cư, đường đôi hoặc đường một chiều có từ hai làn xe cơ giới trở lên (trừ đường cao tốc) loại xe nào dưới đây được tham gia giao thông với tốc độ khai thác tối đa cho phép là 70 km/h?", options: ["Xe ô tô chở người đến 28 chỗ (trừ xe buýt); ô tô tải có trọng tải không lớn hơn 3,5 tấn", "Xe ô tô chở người trên 28 chỗ; ô tô tải có trọng tải trên 3,5 tấn", "Xe buýt; ô tô đầu kéo kéo sơ mi rơ moóc; xe mô tô; ô tô chuyên dùng (trừ ô tô trộn vữa, ô tô trộn bê tông lưu động)"], correct: 2, category: "Luật giao thông", explain: "Xe buýt, xe đầu kéo, xe mô tô và xe chuyên dùng (trừ một số loại đặc biệt) được chạy tối đa 70 km/h ngoài đô thị." },
            { id: 71, question: "Trên đường bộ ngoài khu vực đông dân cư, đường hai chiều hoặc đường một chiều có một làn xe cơ giới (trừ đường cao tốc), loại xe nào dưới đây được tham gia giao thông với tốc độ khai thác tối đa cho phép là 60 km/h?", options: ["Xe ô tô chở người đến 28 chỗ (trừ xe buýt); ô tô tải có trọng tải không lớn hơn 3,5 tấn", "Xe ô tô chở người trên 28 chỗ; ô tô tải có trọng tải trên 3,5 tấn", "Xe buýt; ô tô đầu kéo kéo sơ mi rơ moóc; xe mô tô; ô tô chuyên dùng (trừ ô tô trộn vữa, ô tô trộn bê tông lưu động)"], correct: 2, category: "Luật giao thông", explain: "Xe buýt, xe đầu kéo, xe mô tô và xe chuyên dùng (trừ một số loại) được chạy tối đa 60 km/h trên đường một làn ngoài đô thị." },
            { id: 72, question: "Người lái xe phải giảm tốc độ thấp hơn tốc độ tối đa cho phép đến mức cần thiết, chú ý quan sát và chuẩn bị sẵn sàng những tình huống có thể xảy ra để phòng ngừa tai nạn trong các trường hợp nào dưới đây?", options: ["Gặp biển báo nguy hiểm và cảnh báo trên đường", "Gặp biển chỉ dẫn trên đường", "Gặp biển báo hết mọi lệnh cấp", "Gặp biển báo hết hạn chế tốc độ tối đa cho phép"], correct: 0, category: "Luật giao thông", explain: "Phải giảm tốc độ khi gặp biển báo nguy hiểm để phòng ngừa tai nạn có thể xảy ra." },
            { id: 73, question: "Khi gặp xe buýt đang dừng đón, trả khách, người điều khiển xe mô tô phải xử lý như thế nào dưới đây?", options: ["Tăng tốc độ để nhanh chóng vượt qua xe buýt", "Quan sát, giảm tốc độ đi qua xe buýt hoặc dừng lại để bảo đảm an toàn"], correct: 1, category: "Luật giao thông", explain: "Phải giảm tốc độ, quan sát cẩn thận vì có thể có hành khách bước xuống xe buýt và băng qua đường." },
            { id: 74, question: "Việc sử dụng xe mô tô, xe gắn máy, xe thô sơ để vận chuyển hành khách, hàng hóa phải thực hiện các quy định nào dưới đây để đảm bảo an toàn giao thông?", options: ["Kiểm tra điều kiện bảo đảm an toàn của xe trước khi tham gia giao thông đường bộ; mang đủ giấy tờ theo quy định", "Kiểm tra việc sắp xếp hàng hóa bảo đảm an toàn; không chở quá số người, chở hàng lý, hàng hoá vượt quá khối lượng cho phép hoặc vượt quá khổ giới hạn của xe", "Cả hai ý trên"], correct: 2, category: "Luật giao thông", explain: "Phải đảm bảo an toàn kỹ thuật xe, chở đúng số người, đúng tải trọng và khổ giới hạn." },
            { id: 75, question: "Những hành vi nào sau đây thể hiện là người có văn hóa giao thông?", options: ["Luôn tuân thủ pháp luật về trật tự, an toàn giao thông đường bộ, nhường nhịn và giúp đỡ người khác", "Đi nhanh, vượt đèn đỏ nếu không có lực lượng Công an", "Bấm còi và nháy đèn liên tục để cảnh báo xe khác", "Tránh nhường đường để đi nhanh hơn"], correct: 0, category: "Văn hóa giao thông", explain: "Văn hóa giao thông là tuân thủ luật, nhường nhịn và giúp đỡ người khác khi tham gia giao thông." },
            { id: 76, question: "Khái niệm về văn hóa giao thông được hiểu như thế nào là đúng?", options: ["Là sự hiểu biết và chấp hành nghiêm chỉnh pháp luật về giao thông, là ý thức trách nhiệm với cộng đồng khi tham gia giao thông", "Là sự tôn trọng, nhường nhịn, giúp đỡ và ứng xử có văn hóa giữa những người tham gia giao thông với nhau", "Cả hai ý trên"], correct: 2, category: "Văn hóa giao thông", explain: "Văn hóa giao thông bao gồm cả hiểu biết luật, ý thức trách nhiệm, tôn trọng và nhường nhịn." },
            { id: 77, question: "Người lái xe không điều khiển xe đi đúng làn đường quy định, phóng nhanh, vượt ẩu, vượt đèn đỏ, đi vào đường cấm được coi là hành vi nào?", options: ["Là thiếu văn hóa giao thông, vi phạm pháp luật về trật tự, an toàn giao thông đường bộ", "Là thiếu văn hóa giao thông"], correct: 0, category: "Văn hóa giao thông", explain: "Sai làn, phóng nhanh, vượt ẩu, vượt đèn đỏ, vào đường cấm là thiếu văn hóa giao thông và vi phạm pháp luật." },
            { id: 78, question: "Người lái xe có văn hóa giao thông khi tham gia giao thông phải tuân thủ những quy định nào dưới đây?", options: ["Điều khiển xe đi trên phần đường, làn đường có ít phương tiện tham gia giao thông, chỉ đội mũ bảo hiểm ở nơi có biển báo bắt buộc đội mũ bảo hiểm", "Chấp hành hiệu lệnh, chỉ dẫn của người điều khiển giao thông, quy định về tốc độ, tín hiệu đèn, biển báo hiệu, vạch kẻ đường; nhường đường cho người đi bộ, người già, trẻ em, người khuyết tật"], correct: 1, category: "Văn hóa giao thông", explain: "Lái xe có văn hóa là tuân thủ mọi quy định về giao thông và nhường đường cho người yếu thế." },
            { id: 79, question: "Người lái xe mô tô có văn hóa giao thông khi tham gia giao thông phải tuân thủ những quy định nào dưới đây?", options: ["Điều khiển xe đi bên phải theo chiều đi của mình; đi đúng phần đường, làn đường quy định; đội mũ bảo hiểm đúng quy chuẩn kỹ thuật quốc gia, cài quai đúng quy cách", "Điều khiển xe đi trên phần đường, làn đường có ít phương tiện giao thông", "Điều khiển xe và đội mũ bảo hiểm ở nơi có biển báo bắt buộc đội mũ bảo hiểm"], correct: 0, category: "Văn hóa giao thông", explain: "Lái xe mô tô có văn hóa là đi đúng làn đường, đội mũ bảo hiểm đúng cách và cài quai chắc chắn." },
            { id: 80, question: "Trong các hành vi dưới đây, người lái xe có văn hóa giao thông phải ứng xử như thế nào?", options: ["Điều khiển xe đi bên phải theo chiều đi của mình; đi đúng phần đường, làn đường quy định; dừng, đỗ xe đúng nơi quy định; đã uống rượu, bia thì không lái xe", "Điều khiển xe đi trên phần đường, làn đường có ít phương tiện giao thông; dừng xe, đỗ xe ở nơi thuận tiện hoặc theo yêu cầu của hành khách, của người thân", "Dừng và đỗ xe ở nơi thuận tiện cho việc chuyên chở hành khách và giao nhận hàng hóa; sử dụng ít rượu, bia thì có thể lái xe"], correct: 0, category: "Văn hóa giao thông", explain: "Người có văn hóa giao thông đi đúng làn, dừng đỗ đúng nơi quy định và không uống rượu bia khi lái xe." },
            { id: 81, question: "Khi tham gia giao thông việc sử dụng còi xe nên dùng như thế nào để thể hiện là người có văn hóa giao thông?", options: ["Chỉ bấm còi khi thật sự cần thiết, không bấm còi liên tục hoặc kéo dài, sử dụng còi với mức âm lượng theo quy định", "Bấm còi liên tục để các xe khác nhường đường", "Bấm còi to khi đi qua khu vực đông dân cư", "Không cần dùng còi, tránh gây tiếng ồn là văn minh"], correct: 0, category: "Văn hóa giao thông", explain: "Sử dụng còi văn hóa là chỉ bấm khi thật cần thiết, không kéo dài, đúng âm lượng quy định." },
            { id: 82, question: "Người điều khiển phương tiện tham giao thông đường bộ gây ra tai nạn giao thông đường bộ, người liên quan đến vụ tai nạn giao thông đường bộ có trách nhiệm gì dưới đây?", options: ["Dừng ngay phương tiện, cảnh báo nguy hiểm, giữ nguyên hiện trường, trợ giúp người bị nạn và báo tin cho cơ quan Công an, cơ sở khám bệnh, chữa bệnh", "Ở lại hiện trường vụ tai nạn cho đến khi người của cơ quan Công an đến, trừ trường hợp phải đi cấp cứu, đưa người bị nạn đi cấp cứu hoặc xét thấy bị đe dọa đến tính mạng nhưng phải đến trình báo ngay cơ quan Công an", "Cung cấp thông tin xác định danh tính về bản thân, người liên quan và thông tin liên quan của vụ tai nạn", "Cả ba ý trên"], correct: 3, category: "Văn hóa giao thông", explain: "Khi gây tai nạn phải dừng xe, cứu người, giữ hiện trường, báo tin và cung cấp thông tin." },
            { id: 83, question: "Người có mặt tại nơi xảy ra vụ tai giao thông đường bộ có trách nhiệm gì dưới đây?", options: ["Giúp đỡ, cứu chữa kịp thời người bị nạn; báo tin ngay cho cơ quan Công an, cơ sở khám bệnh, chữa bệnh hoặc Ủy ban nhân dân nơi gần nhất; tham gia bảo vệ hiện trường; tham gia bảo vệ tài sản của người bị nạn; cung cấp thông tin liên quan về vụ tai nạn theo yêu cầu của cơ quan có thẩm quyền", "Chụp lại hình ảnh vụ tai nạn (nếu có thiết bị ghi hình) và nhanh chóng rời khỏi hiện trường vụ tai nạn"], correct: 0, category: "Văn hóa giao thông", explain: "Người có mặt tại tai nạn phải giúp đỡ, cứu người, báo tin, bảo vệ hiện trường và cung cấp thông tin." },
            { id: 84, question: "Trong đoạn đường hai chiều tại khu đông dân cư đang ùn tắc, người điều khiển xe mô tô có văn hóa giao thông sẽ lựa chọn cách xử lý tình huống nào dưới đây?", options: ["Cho xe lấn sang làn ngược chiều để nhanh chóng thoát khỏi nơi ùn tắc", "Điều khiển xe trên vỉa hè để nhanh chóng thoát khỏi nơi ùn tắc", "Kiên nhẫn tuân thủ hướng dẫn của người điều khiển giao thông hoặc tín hiệu đèn giao thông, di chuyển trên đúng phần đường bên phải theo chiều đi, nhường đường cho các phương tiện đi ngược chiều"], correct: 2, category: "Văn hóa giao thông", explain: "Khi ùn tắc cần kiên nhẫn, tuân thủ hướng dẫn, đi đúng làn và nhường đường cho xe ngược chiều." },
            { id: 85, question: "Khi điều khiển xe mô tô tay ga xuống đường dốc dài, độ dốc cao, người lái xe cần thực hiện các thao tác nào dưới đây để bảo đảm an toàn?", options: ["Giữ tay ga ở mức độ phù hợp, sử dụng phanh trước và phanh sau để giảm tốc độ", "Nhả hết tay ga, tắt động cơ, sử dụng phanh trước và phanh sau để giảm tốc độ", "Sử dụng phanh trước để giảm tốc độ kết hợp với tắt chìa khóa điện của xe"], correct: 0, category: "Kỹ thuật lái xe", explain: "Xuống dốc dài cần giữ ga phù hợp, sử dụng phanh trước và sau để giảm tốc độ an toàn." },
            { id: 86, question: "Khi điều khiển xe trên đường vòng người lái xe cần phải làm gì để bảo đảm an toàn?", options: ["Quan sát cẩn thận các chướng ngại vật và báo hiệu bằng còi, đèn; giảm tốc độ tới mức cần thiết, về số thấp và thực hiện quay vòng với tốc độ phù hợp với bán kính cong của đường vòng", "Quan sát cẩn thận các chướng ngại vật và báo hiệu bằng còi, đèn; tăng tốc độ để nhanh chóng qua đường vòng và giảm tốc độ sau khi qua đường vòng"], correct: 0, category: "Kỹ thuật lái xe", explain: "Đi đường vòng cần giảm tốc độ, về số thấp và đi với tốc độ phù hợp với bán kính cong." },
            { id: 87, question: "Khi điều khiển xe qua đường sắt, người lái xe cần phải thực hiện các thao tác nào dưới đây để bảo đảm an toàn?", options: ["Khi có chuông báo hoặc thanh chắn đã hạ xuống, người lái xe phải dừng xe tạm thời đúng khoảng cách an toàn, kéo phanh tay nếu đường dốc hoặc phải chờ lâu", "Khi không có chuông báo hoặc thanh chắn không hạ xuống, người lái xe cần phải quan sát nếu thấy đủ điều kiện an toàn thì về số thấp, tăng ga nhẹ và không thay đổi số trong quá trình vượt qua đường sắt để tránh động cơ chết máy", "Cả hai ý trên"], correct: 2, category: "Kỹ thuật lái xe", explain: "Qua đường sắt cần dừng khi có tín hiệu, quan sát khi không có tín hiệu và đi qua an toàn." },
            { id: 88, question: "Trong các loại nhiên liệu dưới đây, loại nhiên liệu nào giảm thiểu ô nhiễm môi trường?", options: ["Xăng và dầu diesel", "Xăng sinh học và khí sinh học", "Cả hai ý trên"], correct: 1, category: "Kỹ thuật lái xe", explain: "Nhiên liệu sinh học như xăng sinh học, khí sinh học giảm ô nhiễm môi trường hơn xăng và dầu diesel truyền thống." },
            { id: 89, question: "Các biện pháp tiết kiệm nhiên liệu khi chạy xe?", options: ["Bảo dưỡng xe theo định kỳ và có kế hoạch lộ trình trước khi xe chạy", "Kiểm tra áp suất lốp theo quy định và chạy xe với tốc độ phù hợp với tình trạng mặt đường và mật độ giao thông trên đường", "Cả hai ý trên"], correct: 2, category: "Kỹ thuật lái xe", explain: "Tiết kiệm nhiên liệu bằng cách bảo dưỡng xe định kỳ, kiểm tra lốp và chạy tốc độ phù hợp." },
            { id: 90, question: "Khi tầm nhìn bị hạn chế bởi sương mù hoặc mưa to, người lái xe phải thực hiện các thao tác nào để bảo đảm an toàn?", options: ["Tăng tốc độ, chạy gần xe trước, nhìn đèn hậu để định hướng", "Giảm tốc độ, chạy cách xa xe trước với khoảng cách an toàn, bật đèn sương mù và đèn chiếu gần", "Tăng tốc độ, bật đèn pha vượt qua xe chạy trước"], correct: 1, category: "Kỹ thuật lái xe", explain: "Khi sương mù hoặc mưa to cần giảm tốc, giữ khoảng cách an toàn, bật đèn sương mù và đèn chiếu gần." },
            { id: 91, question: "Khi đèn pha của xe đi ngược chiều gây chói mắt, làm giảm khả năng quan sát trên đường, người lái xe xử lý như thế nào dưới đây để bảo đảm an toàn?", options: ["Giảm tốc độ, giữ vững tay lái, nhìn chếch sang lề đường bên phải", "Bật đèn pha chiếu xa và giữ nguyên tốc độ", "Tăng tốc độ, bật đèn pha đối diện xe phía trước"], correct: 0, category: "Kỹ thuật lái xe", explain: "Khi bị chói đèn pha ngược chiều cần giảm tốc, nhìn chếch sang lề đường bên phải để tránh mất tầm nhìn." },
            { id: 92, question: "Để đạt được hiệu quả phanh cao nhất, người lái xe mô tô phải sử dụng các kỹ năng như thế nào dưới đây?", options: ["Sử dụng phanh trước", "Sử dụng phanh sau", "Giảm hết ga, sử dụng đồng thời cả phanh sau và phanh trước"], correct: 2, category: "Kỹ thuật lái xe", explain: "Để phanh hiệu quả nhất cần giảm ga và sử dụng đồng thời phanh trước và phanh sau." },
            { id: 93, question: "Khi đang lái xe mô tô hoặc ô tô, nếu có nhu cầu sử dụng điện thoại để nhắn tin hoặc gọi điện, người lái xe phải thực hiện như thế nào trong các tình huống nêu dưới đây?", options: ["Giảm tốc độ để bảo đảm an toàn với xe phía trước và sử dụng điện thoại để liên lạc", "Giảm tốc độ để dừng xe ở nơi cho phép sau đó sử dụng điện thoại để liên lạc", "Tăng tốc độ để cách xa xe phía sau và sử dụng điện thoại để liên lạc"], correct: 1, category: "Kỹ thuật lái xe", explain: "Chỉ được sử dụng điện thoại khi dừng xe ở nơi cho phép, không sử dụng khi đang lái xe." },
            { id: 94, question: "Những thói quen nào dưới đây khi điều khiển xe mô tô tay ga tham gia giao thông dễ gây tai nạn nguy hiểm?", options: ["Sử dụng còi", "Phanh đồng thời cả phanh trước và phanh sau", "Chỉ sử dụng phanh trước"], correct: 2, category: "Kỹ thuật lái xe", explain: "Chỉ phanh trước trên xe tay ga dễ gây ngã xe và tai nạn. Cần phanh đồng thời cả trước và sau." },
            { id: 95, question: "Khi điều khiển xe mô tô quay đầu, người lái xe cần thực hiện như thế nào để bảo đảm an toàn?", options: ["Bật tín hiệu báo rẽ trước khi quay đầu, từ từ giảm tốc độ đến mức có thể dừng lại. Chỉ quay đầu xe tại những nơi được phép quay đầu", "Quan sát an toàn các phương tiện tới từ phía trước, phía sau, hai bên đồng thời nhường đường cho xe từ bên phải và phía trước đi tới", "Cả hai ý trên"], correct: 2, category: "Kỹ thuật lái xe", explain: "Quay đầu xe cần bật tín hiệu, giảm tốc độ, quan sát kỹ các hướng và chỉ quay đầu ở nơi được phép." },
            { id: 96, question: "Người lái xe phải giảm tốc độ thấp hơn tốc độ tối đa cho phép đến mức cần thiết, chú ý quan sát và chuẩn bị sẵn sàng những tình huống có thể xảy ra để phòng ngừa tai nạn trong các trường hợp nào dưới đây?", options: ["Có báo hiệu cảnh báo nguy hiểm hoặc có chướng ngại vật trên đường; chuyển hướng xe chạy hoặc tầm nhìn bị hạn chế", "Nơi cầu, cống hẹp, đập tràn, đường ngầm, hầm chui, hầm đường bộ; có vật nuôi đi trên đường hoặc chăn thả ở ven đường", "Điểm dừng xe, đỗ xe trên đường bộ có khách đang lên, xuống xe", "Cả ba ý trên"], correct: 3, category: "Kỹ thuật lái xe", explain: "Cần giảm tốc độ khi có chướng ngại vật, cầu hẹp, vật nuôi trên đường hoặc nơi có người lên xuống xe." },
            { id: 97, question: "Khi điều khiển phương tiện trong đường hầm đường bộ, người lái xe cần chú ý điều gì?", options: ["Phải bật đèn chiếu gần; không dừng xe, đỗ xe trong hầm; giữ khoảng cách an toàn với xe phía trước", "Được phép quay đầu xe trong hầm", "Được phép lùi xe trong hầm khi cần thiết"], correct: 0, category: "Kỹ thuật lái xe", explain: "Trong hầm phải bật đèn chiếu gần, không dừng đỗ, quay đầu, lùi xe và giữ khoảng cách an toàn." },
            { id: 98, question: "Kỹ thuật lái xe mô tô an toàn khi đi qua đoạn đường ngập nước là gì?", options: ["Tăng tốc độ nhanh chóng để xe không bị chìm", "Giảm tốc độ, giữ ga ổn định, đi qua chậm rãi không để nước vào ống xả và không tắt máy", "Tắt máy và đẩy xe qua đoạn đường ngập nước"], correct: 1, category: "Kỹ thuật lái xe", explain: "Qua đường ngập nước cần giảm tốc, giữ ga ổn định, đi chậm và không tắt máy để tránh nước vào ống xả." },
            { id: 99, question: "Khi cần dừng xe đột ngột, người lái xe mô tô nên phanh như thế nào để tránh ngã?", options: ["Phanh gấp chỉ phanh trước", "Phanh gấp chỉ phanh sau", "Phanh đều cả phanh trước và phanh sau, giảm dần lực phanh để tránh bánh xe bị trượt"], correct: 2, category: "Kỹ thuật lái xe", explain: "Cần phanh đều cả trước và sau, giảm dần lực phanh để tránh trượt bánh và ngã xe." },
            { id: 100, question: "Khi điều khiển xe mô tô trên đường đèo dốc, cần chú ý điều gì?", options: ["Tăng tốc độ để leo dốc nhanh hơn", "Giảm tốc độ, đi sát lề đường bên phải, sử dụng phanh engine braking kết hợp phanh chân khi cần", "Đi giữa đường để quan sát tốt hơn"], correct: 1, category: "Kỹ thuật lái xe", explain: "Đi đèo dốc cần giảm tốc, đi sát lề phải, sử dụng phanh động cơ kết hợp phanh chân để kiểm soát tốc độ." },

            { id: 101, question: "Biển báo P.101 (đường cấm) có ý nghĩa như thế nào?", options: ["Cấm tất cả các loại phương tiện giao thông đi vào (cả hai chiều), trừ xe ưu tiên theo quy định", "Cấm một số loại phương tiện nhất định", "Cảnh báo nguy hiểm phía trước", "Chỉ dẫn hướng đi"], correct: 0, category: "Biển báo giao thông", explain: "Biển P.101 báo hiệu đường cấm tất cả các loại phương tiện đi lại cả hai chiều, trừ các xe ưu tiên theo quy định.", image: "P.101" },

            { id: 132, question: "Biển báo R.307 (hết hạn chế tốc độ tối thiểu) có ý nghĩa như thế nào?", options: ["Báo hiệu hết hạn chế tốc độ tối đa", "Báo hiệu hết đoạn đường hạn chế tốc độ tối thiểu cho phép", "Bắt đầu đường cao tốc", "Cấm chạy xe dưới tốc độ tối thiểu"], correct: 1, category: "Biển báo giao thông", explain: "Biển R.307 báo hiệu hết giá trị của biển tốc độ tối thiểu cho phép đặt trước đó.", image: "R.307" },
            { id: 133, question: "Biển báo P.124a (cấm quay đầu xe) có ý nghĩa như thế nào?", options: ["Cấm rẽ trái và rẽ phải", "Cấm quay đầu xe (không cấm rẽ trái/phải)", "Cấm đi ngược chiều", "Cảnh báo đường cụt"], correct: 1, category: "Biển báo giao thông", explain: "Biển P.124a (hoặc P.124a1 trên một số hệ thống) báo hiệu cấm quay đầu xe đối với các phương tiện.", image: "P.124a1" },
            { id: 134, question: "Biển báo P.131 (cấm đỗ xe) có ý nghĩa như thế nào?", options: ["Cấm dừng xe và đỗ xe", "Cấm đỗ xe ở đường có biển này, được dừng xe tạm thời", "Chỉ cấm xe ô tô dừng đỗ", "Cấm xe tải đỗ xe"], correct: 1, category: "Biển báo giao thông", explain: "Biển P.131 cấm đỗ xe ở đoạn đường đặt biển này, người lái xe vẫn được phép dừng xe tạm thời.", image: "P.131" },
            { id: 135, question: "Biển báo P.132 (nhường đường cho xe cơ giới đi ngược chiều qua đường hẹp) có ý nghĩa như thế nào?", options: ["Các xe được đi trước qua đường hẹp", "Buộc các xe cơ giới phải nhường đường cho xe đi ngược chiều qua đoạn đường hẹp", "Cấm xe ngược chiều đi vào", "Cảnh báo đường hẹp hai bên"], correct: 1, category: "Biển báo giao thông", explain: "Biển P.132 báo hiệu các xe cơ giới phải nhường đường cho xe ngược chiều đi qua đường hẹp.", image: "P.132" },
            { id: 136, question: "Biển báo P.133 (hết cấm vượt) có ý nghĩa như thế nào?", options: ["Báo hiệu hết cấm tất cả các lệnh cấm", "Báo hiệu hết giá trị lệnh cấm vượt cho các phương tiện cơ giới", "Cấm vượt phía trước", "Cho phép chạy tốc độ tối đa"], correct: 1, category: "Biển báo giao thông", explain: "Biển P.133 báo hiệu hết giá trị của lệnh cấm vượt đặt trước đó đối với các phương tiện cơ giới.", image: "P.133" },
            { id: 137, question: "Biển báo P.134 (hết tất cả các lệnh cấm) có ý nghĩa như thế nào?", options: ["Báo hiệu hết lệnh cấm vượt", "Báo hiệu hết hạn chế tốc độ tối đa", "Báo hiệu hết tác dụng của tất cả các biển cấm đã đặt trước đó trên đoạn đường", "Bắt đầu khu đông dân cư"], correct: 2, category: "Biển báo giao thông", explain: "Biển P.134 báo hiệu hết tác dụng của tất cả các biển cấm đã được cắm trước đó trên đoạn đường.", image: "P.134" },
