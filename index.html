            { id: 139, question: "Biển báo P.136 (cấm đi thẳng và rẽ trái) có ý nghĩa như thế nào?", options: ["Cấm các xe đi thẳng và rẽ phải", "Cấm các xe rẽ trái và quay đầu", "Cấm tất cả phương tiện đi thẳng và rẽ trái tại nút giao", "Chỉ được rẽ phải và đi thẳng"], correct: 2, category: "Biển báo giao thông", explain: "Biển P.136 cấm các phương tiện đi thẳng và rẽ trái tại nút giao tiếp theo.", image: "P.136" },
            { id: 140, question: "Biển báo R.401 (bắt đầu đường ưu tiên) có ý nghĩa như thế nào?", options: ["Báo hiệu bắt đầu đoạn đường ưu tiên, các phương tiện trên đường này được quyền đi trước qua nơi giao nhau", "Báo hiệu kết thúc đoạn đường ưu tiên", "Chỉ dẫn nơi đỗ xe", "Cấm xe đi vào đường này"], correct: 0, category: "Biển báo giao thông", explain: "Biển R.401 báo hiệu bắt đầu đoạn đường ưu tiên, các phương tiện được đi trước qua nút giao giao cắt.", image: "R.401" },
            { id: 141, question: "Biển báo R.402 (hết đường ưu tiên) có ý nghĩa như thế nào?", options: ["Báo hiệu bắt đầu đường ưu tiên", "Báo hiệu hết đoạn đường ưu tiên, các xe phải nhường đường bình thường", "Chỉ dẫn trạm cấp cứu", "Hết hạn chế tốc độ"], correct: 1, category: "Biển báo giao thông", explain: "Biển R.402 báo hiệu kết thúc đoạn đường ưu tiên đặt trước đó.", image: "R.402" },
            { id: 142, question: "Biển báo R.403 (đường dành cho xe ô tô) có ý nghĩa như thế nào?", options: ["Cấm xe ô tô đi vào", "Chỉ dẫn đường dành riêng cho xe ô tô đi lại, các phương tiện khác không được đi vào", "Đường dành cho xe buýt", "Đường dành cho ô tô và xe máy"], correct: 1, category: "Biển báo giao thông", explain: "Biển R.403 báo hiệu đường dành riêng cho xe ô tô hoạt động, cấm các phương tiện khác đi vào.", image: "R.403" },
            { id: 143, question: "Biển báo P.107a (cấm xe ô tô khách và ô tô tải) có ý nghĩa như thế nào?", options: ["Cấm ô tô khách đi vào", "Cấm ô tô tải đi vào", "Cấm cả xe ô tô khách và xe ô tô tải đi vào đường có biển này, trừ xe ưu tiên", "Cấm ô tô taxi"], correct: 2, category: "Biển báo giao thông", explain: "Biển P.107a cấm cả xe ô tô chở khách và xe ô tô tải đi vào đường này.", image: "P.107a" },
            { id: 144, question: "Biển báo P.107b (cấm xe ô tô taxi) có ý nghĩa như thế nào?", options: ["Cấm tất cả ô tô con", "Cấm xe ô tô taxi đi vào đường này", "Đường dành riêng cho ô tô taxi", "Cấm xe taxi đỗ dừng"], correct: 1, category: "Biển báo giao thông", explain: "Biển P.107b báo hiệu đường cấm xe ô tô chở khách dạng taxi đi vào.", image: "P.107b" },
            { id: 145, question: "Biển báo W.203 (đường bị hẹp) có ý nghĩa như thế nào?", options: ["Báo trước sắp đến đoạn đường bị hẹp cả hai bên hoặc một bên", "Báo hiệu đường có nhiều cua ngoặt liên tiếp", "Đường một chiều phía trước", "Cầu hẹp phía trước"], correct: 0, category: "Biển báo giao thông", explain: "Biển W.203 (bao gồm W.203a,b,c) cảnh báo đoạn đường phía trước bị thu hẹp diện tích lưu thông.", image: "W.203" },
            { id: 146, question: "Biển báo W.233 (nguy hiểm khác) có ý nghĩa như thế nào?", options: ["Cảnh báo đoạn đường hay có tai nạn", "Báo trước sắp đến đoạn đường có những nguy hiểm khác mà không có biển báo chuyên biệt", "Báo đường bị trơn trượt", "Cấm mọi xe đi vào"], correct: 1, category: "Biển báo giao thông", explain: "Biển W.233 (với hình dấu chấm than) cảnh báo những tình huống nguy hiểm khác chưa được mô tả cụ thể.", image: "W.233" },
            { id: 147, question: "Biển báo P.116 (cấm quay đầu xe và đi ngược chiều) có ý nghĩa như thế nào?", options: ["Cấm quay đầu xe nhưng được đi thẳng", "Cấm quay đầu xe và cấm đi ngược chiều tại nút giao", "Chỉ cấm đi ngược chiều", "Cấm rẽ trái và quay đầu"], correct: 1, category: "Biển báo giao thông", explain: "Biển P.116 cấm các phương tiện thực hiện hành vi đi ngược chiều và quay đầu xe.", image: "P.116" },
            { id: 148, question: "Biển báo W.221 (đường không bằng phẳng) có ý nghĩa như thế nào?", options: ["Báo hiệu đường trơn trượt", "Báo trước đoạn đường không bằng phẳng, có ổ gà, lồi lõm hoặc sống trâu", "Báo hiệu đường đang sửa chữa", "Cầu vượt phía trước"], correct: 1, category: "Biển báo giao thông", explain: "Biển W.221 cảnh báo đoạn đường phía trước không bằng phẳng, gồ ghề.", image: "W.221" },
            { id: 149, question: "Biển báo W.222 (đường trơn) có ý nghĩa như thế nào?", options: ["Báo hiệu sắp đến đoạn đường đôi", "Báo trước đoạn đường có thể xảy ra trơn trượt đặc biệt khi thời tiết xấu", "Báo đường bị lún sụt", "Đường dành riêng cho xe thô sơ"], correct: 1, category: "Biển báo giao thông", explain: "Biển W.222 cảnh báo đoạn đường trơn trượt nguy hiểm, lái xe cần đi chậm.", image: "W.222" },
            { id: 150, question: "Biển báo P.113 (cấm xe người kéo đẩy) có ý nghĩa như thế nào?", options: ["Cấm xe đạp đi vào", "Cấm xe súc vật kéo", "Cấm xe người kéo, đẩy đi vào đường này", "Đường dành cho người kéo xe"], correct: 2, category: "Biển báo giao thông", explain: "Biển P.113 báo hiệu đường cấm các loại xe người kéo, đẩy đi vào.", image: "P.113" },
            // NHÓM 3: GIẢI THẾ SA HÌNH VÀ XỬ LÝ TÌNH HUỐNG (35 câu - Câu 151-185)
            { id: 151, question: "Thứ tự ưu tiên khi giải thế sa hình theo quy tắc giao thông Việt Nam là gì?", options: ["Nhất chờm, nhì ưu, tam đường, tứ hướng", "Nhì ưu, nhất chờm, tam đường, tứ hướng", "Tam đường, nhất chờm, nhì ưu, tứ hướng", "Tứ hướng, tam đường, nhì ưu, nhất chờm"], correct: 0, category: "Sa hình", explain: "Thứ tự ưu tiên: Nhất chờm (xe vào giao lộ được quyền đi trước) → Nhì ưu (xe ưu tiên) → Tam đường (đường ưu tiên) → Tứ hướng (nhường bên phải)." },
            { id: 152, question: "Tại giao lộ có tín hiệu đèn giao thông, xe nào được quyền đi trước khi đèn chuyển từ xanh sang vàng?", options: ["Xe đang ở trong giao lộ được đi tiếp", "Xe chưa vào giao lộ phải dừng lại", "Xe nào có tốc độ nhanh hơn", "Xe nào đến trước"], correct: 0, category: "Sa hình", explain: "Khi đèn vàng, xe đang ở trong giao lộ được quyền đi tiếp; xe chưa vào phải dừng lại." },
            { id: 153, question: "Tại giao lộ không có tín hiệu đèn, không có biển ưu tiên, xe nào được quyền đi trước?", options: ["Xe đến trước", "Xe đến sau", "Xe ở bên phải không có xe", "Xe lớn hơn"], correct: 2, category: "Sa hình", explain: "Tại giao lộ không có ưu tiên, xe ở bên phải không có xe được quyền đi trước (quy tắc nhường bên phải)." },
            { id: 154, question: "Xe ưu tiên nào có quyền đi trước xe khác khi làm nhiệm vụ?", options: ["Xe chữa cháy, xe quân sự, xe công an, xe cứu thương, xe hộ đê", "Xe buýt, xe tải, xe con", "Tất cả các loại xe", "Không có xe ưu tiên"], correct: 0, category: "Sa hình", explain: "Thứ tự ưu tiên: Cứu hỏa → Quân sự → Công an → Cứu thương → Xe hộ đê khi làm nhiệm vụ." },
            { id: 155, question: "Khi gặp xe cứu thương đang phát tín hiệu ưu tiên, người lái xe phải làm gì?", options: ["Tăng tốc để đi trước", "Giảm tốc độ, đi sát lề đường bên phải và dừng lại nhường đường", "Tiếp tục đi bình thường", "Bấm còi phản đối"], correct: 1, category: "Sa hình", explain: "Phải giảm tốc độ, đi sát lề phải và dừng lại nhường đường cho xe cứu thương đang làm nhiệm vụ." },
            { id: 156, question: "Tại giao lộ có xe ưu tiên đang làm nhiệm vụ, xe thường phải làm gì?", options: ["Cố gắng đi trước", "Nhường đường hoàn toàn cho xe ưu tiên", "Bấm còi yêu cầu nhường đường", "Đi nhanh qua giao lộ"], correct: 1, category: "Sa hình", explain: "Phải nhường đường hoàn toàn cho xe ưu tiên đang làm nhiệm vụ, không được cản trở." },
            { id: 157, question: "Khi hai xe đến giao lộ cùng lúc, không có xe ưu tiên, không có biển ưu tiên, xe nào được đi trước?", options: ["Xe đến từ bên phải", "Xe đến từ bên trái", "Xe đến trước", "Xe lớn hơn"], correct: 0, category: "Sa hình", explain: "Theo quy tắc tứ hướng, xe đến từ bên phải (không có xe) được quyền đi trước." },
            { id: 158, question: "Tại giao lộ có biển ưu tiên, xe trên đường ưu tiên có quyền ưu tiên như thế nào?", options: ["Được đi trước xe trên đường không ưu tiên", "Phải dừng lại nhường đường cho tất cả", "Chỉ được ưu tiên khi có xe ưu tiên", "Không có quyền ưu tiên"], correct: 0, category: "Sa hình", explain: "Xe trên đường ưu tiên được quyền đi trước xe trên đường không ưu tiên khi đến giao lộ." },
            { id: 159, question: "Khi xe xuống dốc và xe lên dốc gặp nhau tại đoạn đường hẹp, xe nào phải nhường đường?", options: ["Xe xuống dốc nhường đường cho xe lên dốc", "Xe lên dốc nhường đường cho xe xuống dốc", "Xe nào đến trước", "Xe nào lớn hơn"], correct: 0, category: "Sa hình", explain: "Theo quy tắc giao thông, xe xuống dốc phải nhường đường cho xe lên dốc." },
            { id: 160, question: "Khi có xe xin vượt từ phía sau, người lái xe phải làm gì nếu đủ điều kiện an toàn?", options: ["Tăng tốc để xe không vượt được", "Giảm tốc độ, đi sát bên phải và nhường đường cho xe vượt", "Lái xe sang làn trái để cản xe vượt", "Bấm còi phản đối"], correct: 1, category: "Sa hình", explain: "Khi có xe xin vượt, phải giảm tốc độ, đi sát bên phải và nhường đường cho xe vượt." },
            { id: 161, question: "Trên đường một chiều có hai làn xe, xe chạy nhanh phải đi ở làn nào?", options: ["Làn bên trái", "Làn bên phải", "Làn nào cũng được", "Làn giữa"], correct: 0, category: "Sa hình", explain: "Trên đường một chiều, xe chạy nhanh đi ở làn trái, xe chạy chậm đi ở làn phải." },
            { id: 162, question: "Khi chuyển hướng rẽ phải tại giao lộ, người lái xe phải nhường đường cho đối tượng nào?", options: ["Chỉ nhường đường cho xe đi thẳng", "Nhường đường cho người đi bộ và xe đi thẳng qua", "Không cần nhường đường", "Chỉ nhường đường cho xe lớn"], correct: 1, category: "Sa hình", explain: "Khi rẽ phải phải nhường đường cho người đi bộ đang băng qua và xe đi thẳng qua giao lộ." },
            { id: 163, question: "Khi chuyển hướng rẽ trái tại giao lộ có xe đi thẳng từ phía đối diện, xe nào được quyền đi trước?", options: ["Xe rẽ trái", "Xe đi thẳng", "Xe nào đến trước", "Xe nào lớn hơn"], correct: 1, category: "Sa hình", explain: "Xe đi thẳng có quyền ưu tiên trước xe rẽ trái tại giao lộ." },
            { id: 164, question: "Tại nơi đường giao nhau có vòng xuyến (roundabout), xe nào được quyền đi trước?", options: ["Xe đang trong vòng xuyến", "Xe muốn vào vòng xuyến", "Xe đến từ bên phải", "Xe lớn hơn"], correct: 0, category: "Sa hình", explain: "Tại vòng xuyến, xe đang trong vòng xuyến được quyền đi trước, xe muốn vào phải nhường đường." },
            { id: 165, question: "Khi gặp người đi bộ đang băng qua đường tại vạch dừng xe, người lái xe phải làm gì?", options: ["Tăng tốc để đi qua nhanh", "Dừng lại nhường đường cho người đi bộ", "Bấm còi để người đi bộ tránh ra", "Tiếp tục đi với tốc độ bình thường"], correct: 1, category: "Sa hình", explain: "Phải dừng lại và nhường đường cho người đi bộ đang băng qua đường tại vạch dừng." },
            { id: 166, question: "Khi gặp xe buýt đang dừng đón khách, người lái xe phải xử lý như thế nào?", options: ["Vượt qua nhanh", "Giảm tốc độ, quan sát cẩn thận vì có thể có người đi bộ băng qua", "Bấm còi yêu cầu nhường đường", "Đi sát đuôi xe buýt"], correct: 1, category: "Sa hình", explain: "Phải giảm tốc độ, quan sát cẩn thận vì hành khách có thể bước xuống và băng qua đường bất ngờ." },
            { id: 167, question: "Tại đường một chiều, người lái xe mô tô có được phép đi ngược chiều không?", options: ["Được phép nếu đường vắng", "Không được phép đi ngược chiều", "Được phép trong giờ cao điểm", "Được phép nếu có biển báo"], correct: 1, category: "Sa hình", explain: "Tuyệt đối không được phép đi ngược chiều trên đường một chiều." },
            { id: 168, question: "Khi gặp xe cứu hỏa đang làm nhiệm vụ với còi hụ và đèn nháy đỏ, người lái xe phải làm gì?", options: ["Tăng tốc để tránh", "Nhường đường hoàn toàn cho xe cứu hỏa đi qua trước", "Tiếp tục đi bình thường", "Chuyển sang làn đường bên trái"], correct: 1, category: "Sa hình", explain: "Phải nhường đường hoàn toàn, đi sát lề đường bên phải và dừng lại nếu cần để xe cứu hỏa đi qua." },
            { id: 169, question: "Khi đi qua khu vực có trẻ em đang chơi đùa gần đường, người lái xe phải làm gì?", options: ["Tăng tốc để nhanh chóng qua", "Giảm tốc độ, quan sát cẩn thận và sẵn sàng dừng xe", "Bấm còi để trẻ em tránh ra", "Tiếp tục đi với tốc độ bình thường"], correct: 1, category: "Sa hình", explain: "Phải giảm tốc độ, quan sát cẩn thận vì trẻ em có thể bất ngờ chạy ra đường." },
            { id: 170, question: "Tại giao lộ có hiệu lệnh của Cảnh sát giao thông khác với tín hiệu đèn, người lái xe phải tuân theo hiệu lệnh nào?", options: ["Tín hiệu đèn giao thông", "Hiệu lệnh của Cảnh sát giao thông", "Hiệu lệnh nào đến trước", "Hiệu lệnh nào dễ thực hiện hơn"], correct: 1, category: "Sa hình", explain: "Hiệu lệnh của Cảnh sát giao thông có giá trị cao nhất, phải tuân theo dù trái với tín hiệu đèn." },
            { id: 171, question: "Khi đang lái xe gặp đường ngập nước, người lái xe mô tô phải xử lý như thế nào?", options: ["Tăng tốc độ để xe không bị chìm", "Giảm tốc độ, đi chậm và ổn định, không tắt máy", "Tắt máy và đẩy xe qua", "Quay đầu xe tìm đường khác"], correct: 1, category: "Sa hình", explain: "Qua đường ngập nước cần giảm tốc, đi chậm, giữ ga ổn định và không tắt máy để tránh nước vào ống xả." },
            { id: 172, question: "Khi gặp xe chở hàng cồng kềnhnh đang đi trước, người lái xe phải xử lý như thế nào để vượt an toàn?", options: ["Vượt ngay mà không cần tín hiệu", "Bật tín hiệu báo rẽ, quan sát kỹ và vượt từ bên trái khi đủ điều kiện", "Bấm còi để xe trước nhường đường", "Đi sát đuôi xe trước"], correct: 1, category: "Sa hình", explain: "Vượt xe chở hàng cồng kềnh cần bật tín hiệu, quan sát kỹ và vượt từ bên trái khi đủ khoảng cách an toàn." },
            { id: 173, question: "Tại đường đôi có dải phân cách, người lái xe có được phép quay đầu ở giữa đường không?", options: ["Được phép nếu không có xe đối diện", "Không được phép quay đầu ở giữa đường đôi", "Được phép ban đêm", "Được phép khi đường vắng"], correct: 1, category: "Sa hình", explain: "Không được phép quay đầu ở giữa đường đôi có dải phân cách, phải tìm nơi được phép quay đầu." },
            { id: 174, question: "Khi gặp xe đi ngược chiều đang cố tình chen vào làn đường của mình, người lái xe phải xử lý như thế nào?", options: ["Cố gắng giữ làn đường", "Nhường đường và báo hiệu cho xe đối diện", "Tăng tốc để không cho xe kia chen vào", "Bấm còi liên tục"], correct: 1, category: "Sa hình", explain: "Nên nhường đường để tránh va chạm, không nên cố giữ làn khi xe kia đã chen vào." },
            { id: 175, question: "Tại nơi đường giao nhau có báo hiệu đi theo vòng xuyến, xe nào được quyền đi trước?", options: ["Xe đến trước", "Xe đang trong vòng xuyến", "Xe đến từ bên phải", "Xe lớn hơn"], correct: 1, category: "Sa hình", explain: "Tại vòng xuyến, xe đang trong vòng xuyến luôn được quyền đi trước các xe muốn nhập vào." },
            // NHÓM 4: CÂU ĐIỂM LIỆT (20 câu - Câu 186-205)
            { id: 176, question: "Khi điều khiển xe mô tô đi vào đường cao tốc, người lái xe có văn hóa giao thông phải xử lý như thế nào?", options: ["Được phép đi vào đường cao tốc nếu đủ điều kiện", "Không được phép đi vào đường cao tốc với xe mô tô theo quy định", "Được phép đi vào nếu đường vắng", "Được phép đi vào nếu đi nhanh"], correct: 1, category: "Điểm liệt", explain: "Xe mô tô không được phép đi vào đường cao tốc theo quy định giao thông. ĐÂY LÀ CÂU ĐIỂM LIỆT.", diemLiet: true },
            { id: 177, question: "Khi gặp xe cứu thương đang phát tín hiệu ưu tiên đi ngược chiều, người lái xe phải xử lý như thế nào?", options: ["Tăng tốc để tránh", "Dừng lại ngay lập tức và nhường đường cho xe cứu thương", "Tiếp tục đi bình thường", "Chuyển sang làn đường bên trái"], correct: 1, category: "Điểm liệt", explain: "Phải dừng lại và nhường đường ngay cho xe cứu thương. ĐÂY LÀ CÂU ĐIỂM LIỆT." },
            { id: 178, question: "Khi trong máu hoặc hơi thở có nồng độ cồn, người lái xe có bị cấm điều khiển phương tiện giao thông không?", options: ["Không bị cấm", "Bị nghiêm cấm tuyệt đối", "Chỉ bị cấm khi say rượu nặng", "Chỉ bị cấm khi gây tai nạn"], correct: 1, category: "Điểm liệt", explain: "Nghiêm cấm tuyệt đối điều khiển xe khi trong người có nồng độ cồn. ĐÂY LÀ CÂU ĐIỂM LIỆT.", diemLiet: true },
            { id: 179, question: "Khi điều khiển xe mô tô không đội mũ bảo hiểm gây tai nạn, hậu quả có thể như thế nào?", options: ["Chỉ bị phạt tiền", "Có thể bị ngã xe và chấn thương nghiêm trọng hoặc tử vong", "Không có hậu quả nghiêm trọng", "Chỉ bị thương nhẹ"], correct: 1, category: "Điểm liệt", explain: "Không đội mũ bảo hiểm khi gây tai nạn có thể dẫn đến chấn thương nghiêm trọng. ĐÂY LÀ CÂU ĐIỂM LIỆT.", diemLiet: true },
            { id: 180, question: "Khi điều khiển xe mô tô lạng lách, đánh võng trên đường gây nguy hiểm cho người khác, đây là hành vi như thế nào?", options: ["Hành vi bình thường", "Hành vi nguy hiểm bị nghiêm cấm và có thể gây tai nạn nghiêm trọng", "Hành vi chỉ bị phạt nhẹ", "Hành vi không vi phạm luật"], correct: 1, category: "Điểm liệt", explain: "Lạng lách, đánh võng là hành vi nguy hiểm bị nghiêm cấm, có thể gây tai nạn chết người. ĐÂY LÀ CÂU ĐIỂM LIỆT.", diemLiet: true },
            { id: 181, question: "Khi điều khiển xe mô tô vượt đèn đỏ gây tai nạn, đây có phải là hành vi đặc biệt nguy hiểm không?", options: ["Không nguy hiểm", "Có, đây là hành vi vi phạm nghiêm trọng có thể gây tai nạn chết người", "Chỉ bị phạt tiền", "Hành vi bình thường"], correct: 1, category: "Điểm liệt", explain: "Vượt đèn đỏ là hành vi đặc biệt nguy hiểm, có thể gây tai nạn chết người. ĐÂY LÀ CÂU ĐIỂM LIỆT.", diemLiet: true },
            { id: 182, question: "Khi điều khiển xe mô tô đi vào đường cấm theo biển báo, người lái xe phải xử lý như thế nào?", options: ["Được phép đi vào nếu đường vắng", "Không được phép đi vào đường có biển cấm", "Được phép đi vào nếu không có CSGT", "Được phép đi vào ban đêm"], correct: 1, category: "Điểm liệt", explain: "Phải tuân thủ biển báo cấm, không được đi vào đường cấm. ĐÂY LÀ CÂU ĐIỂM LIỆT.", diemLiet: true },
            { id: 183, question: "Khi gặp hiệu lệnh dừng lại của Cảnh sát giao thông mà không chấp hành, hậu quả có thể như thế nào?", options: ["Chỉ bị phạt tiền", "Có thể bị tước GPLX, phạt tù hoặc gây nguy hiểm nghiêm trọng", "Không có hậu quả nghiêm trọng", "Chỉ bị nhắc nhở"], correct: 1, category: "Điểm liệt", explain: "Không chấp hành hiệu lệnh CSGT là hành vi vi phạm nghiêm trọng, có thể bị tước GPLX. ĐÂY LÀ CÂU ĐIỂM LIỆT.", diemLiet: true },
            { id: 184, question: "Khi điều khiển xe mô tô trên đường một chiều đi ngược chiều gây va chạm với xe đi đúng chiều, lỗi thuộc về ai?", options: ["Lỗi thuộc về xe đi đúng chiều", "Lỗi hoàn toàn thuộc về xe đi ngược chiều", "Lỗi chia đều cho hai xe", "Không xác định được"], correct: 1, category: "Điểm liệt", explain: "Xe đi ngược chiều trên đường một chiều hoàn toàn có lỗi và gây nguy hiểm. ĐÂY LÀ CÂU ĐIỂM LIỆT.", diemLiet: true },
            { id: 185, question: "Khi điều khiển xe mô tô trong tình trạng không đủ điều kiện lái xe (mệt mỏi, say rượu) và gây tai nạn, đây là hành vi như thế nào?", options: ["Hành vi bình thường", "Hành vi đặc biệt nguy hiểm, có thể bị xử lý hình sự nếu gây hậu quả nghiêm trọng", "Chỉ bị phạt tiền", "Không vi phạm luật"], correct: 1, category: "Điểm liệt", explain: "Lái xe trong tình trạng không đủ điều kiện và gây tai nạn là hành vi đặc biệt nguy hiểm. ĐÂY LÀ CÂU ĐIỂM LIỆT.", diemLiet: true },
            { id: 186, question: "Khi điều khiển xe mô tô đi vào đường dành cho người đi bộ (vỉa hè), người lái xe có văn hóa giao thông phải xử lý như thế nào?", options: ["Được phép đi trên vỉa hè nếu đường đông", "Không được phép đi xe trên vỉa hè dành cho người đi bộ", "Được phép đi trên vỉa hè nếu đi chậm", "Được phép đi trên vỉa hè ban đêm"], correct: 1, category: "Điểm liệt", explain: "Không được phép đi xe trên vỉa hè dành cho người đi bộ, đây là hành vi nguy hiểm. ĐÂY LÀ CÂU ĐIỂM LIỆT.", diemLiet: true },
            { id: 187, question: "Khi điều khiển xe mô tô trên đường cao tốc không đủ điều kiện và gây tai nạn, có thể bị xử lý như thế nào?", options: ["Chỉ bị phạt tiền", "Có thể bị xử phạt hành chính và bồi thường thiệt hại, thậm chí xử lý hình sự nếu gây hậu quả nghiêm trọng", "Không bị xử lý", "Chỉ bị nhắc nhở"], correct: 1, category: "Điểm liệt", explain: "Xe mô tô không được phép đi vào đường cao tốc, vi phạm gây tai nạn sẽ bị xử lý nghiêm. ĐÂY LÀ CÂU ĐIỂM LIỆT.", diemLiet: true },
            { id: 188, question: "Khi điều khiển xe mô tô chở người vượt quá số lượng cho phép (4-5 người trên xe máy) gây mất thăng bằng và tai nạn, đây là hành vi như thế nào?", options: ["Hành vi bình thường", "Hành vi vi phạm nghiêm trọng, có thể gây tai nạn nguy hiểm do quá tải và mất thăng bằng", "Chỉ bị phạt tiền", "Hành vi không vi phạm"], correct: 1, category: "Điểm liệt", explain: "Chở quá tải trọng là hành vi nguy hiểm, dễ gây mất thăng bằng và tai nạn. ĐÂY LÀ CÂU ĐIỂM LIỆT.", diemLiet: true },
            { id: 189, question: "Khi điều khiển xe mô tô trong tình trạng sử dụng điện thoại (nghe, gọi, nhắn tin) gây tai nạn, có thể bị xử lý như thế nào?", options: ["Chỉ bị phạt tiền nhẹ", "Có thể bị xử phạt hành chính và bồi thường thiệt hại, thậm chí xử lý hình sự nếu gây hậu quả nghiêm trọng", "Không bị xử lý", "Chỉ bị nhắc nhở"], correct: 1, category: "Điểm liệt", explain: "Sử dụng điện thoại khi lái xe gây mất tập trung, có thể gây tai nạn nghiêm trọng. ĐÂY LÀ CÂU ĐIỂM LIỆT.", diemLiet: true },
            { id: 190, question: "Khi điều khiển xe mô tô trên đường có biển báo cấm vượt nhưng vẫn cố vượt và gây va chạm, lỗi thuộc về ai?", options: ["Lỗi chia đều cho hai xe", "Lỗi hoàn toàn thuộc về người cố tình vượt biển cấm", "Lỗi thuộc về xe phía trước", "Không xác định được lỗi"], correct: 1, category: "Điểm liệt", explain: "Vi phạm biển cấm vượt là hoàn toàn có lỗi và gây nguy hiểm. ĐÂY LÀ CÂU ĐIỂM LIỆT.", diemLiet: true },
            { id: 191, question: "Người điều khiển xe mô tô không có giấy chứng nhận bảo hiểm trách nhiệm dân sự bị phạt bao nhiêu tiền?", options: ["100.000 - 200.000 đồng", "200.000 - 400.000 đồng", "400.000 - 600.000 đồng", "600.000 - 1.000.000 đồng"], correct: 0, category: "Xử phạt vi phạm", explain: "Người điều khiển xe mô tô không có giấy chứng nhận bảo hiểm trách nhiệm dân sự bị phạt từ 100.000 đến 200.000 đồng." },
            { id: 192, question: "Người điều khiển xe mô tô chạy quá tốc độ quy định trên 35 km/h bị phạt bao nhiêu tiền?", options: ["1.000.000 - 2.000.000 đồng", "2.000.000 - 4.000.000 đồng", "4.000.000 - 6.000.000 đồng", "6.000.000 - 8.000.000 đồng"], correct: 1, category: "Xử phạt vi phạm", explain: "Người điều khiển xe mô tô chạy quá tốc độ quy định trên 35 km/h bị phạt từ 2.000.000 đến 4.000.000 đồng." },
            { id: 193, question: "Người điều khiển xe mô tô mang theo vũ khí khi lái xe bị phạt bao nhiêu tiền?", options: ["200.000 - 400.000 đồng", "400.000 - 600.000 đồng", "600.000 - 1.000.000 đồng", "1.000.000 - 2.000.000 đồng"], correct: 2, category: "Xử phạt vi phạm", explain: "Người điều khiển xe mô tô mang theo vũ khí khi lái xe bị phạt từ 600.000 đến 1.000.000 đồng." },
            { id: 194, question: "Người điều khiển xe mô tô tham gia đua xe trái phép bị xử phạt như thế nào?", options: ["Phạt tiền 5.000.000 - 10.000.000 đồng", "Phạt tiền 10.000.000 - 20.000.000 đồng và tước GPLX", "Phạt tiền 15.000.000 - 20.000.000 đồng và tước GPLX", "Tùy theo mức độ vi phạm"], correct: 2, category: "Xử phạt vi phạm", explain: "Người điều khiển xe mô tô tham gia đua xe trái phép bị phạt tiền từ 15.000.000 đến 20.000.000 đồng và bị tước giấy phép lái xe." },
            { id: 195, question: "Người điều khiển xe mô tô rẽ trái không quan sát gây tai nạn bị phạt bao nhiêu tiền?", options: ["400.000 - 600.000 đồng", "600.000 - 1.000.000 đồng", "1.000.000 - 2.000.000 đồng", "2.000.000 - 4.000.000 đồng"], correct: 2, category: "Xử phạt vi phạm", explain: "Người điều khiển xe mô tô rẽ trái không quan sát gây tai nạn bị phạt từ 1.000.000 đến 2.000.000 đồng." },
            { id: 196, question: "Người điều khiển xe mô tô không tuân thủ quy định về vị trí đỗ xe bị phạt bao nhiêu tiền?", options: ["100.000 - 200.000 đồng", "200.000 - 400.000 đồng", "400.000 - 600.000 đồng", "600.000 - 1.000.000 đồng"], correct: 0, category: "Xử phạt vi phạm", explain: "Người điều khiển xe mô tô không tuân thủ quy định về vị trí đỗ xe bị phạt từ 100.000 đến 200.000 đồng." },
            { id: 197, question: "Người điều khiển xe mô tô vận chuyển hàng nguy hiểm không có giấy phép bị phạt bao nhiêu tiền?", options: ["500.000 - 1.000.000 đồng", "1.000.000 - 2.000.000 đồng", "2.000.000 - 4.000.000 đồng", "4.000.000 - 6.000.000 đồng"], correct: 2, category: "Xử phạt vi phạm", explain: "Người điều khiển xe mô tô vận chuyển hàng nguy hiểm không có giấy phép bị phạt từ 2.000.000 đến 4.000.000 đồng." },
            { id: 198, question: "Người điều khiển xe mô tô không chấp hành hiệu lệnh của biển báo cấm bị phạt bao nhiêu tiền?", options: ["200.000 - 400.000 đồng", "400.000 - 600.000 đồng", "600.000 - 1.000.000 đồng", "1.000.000 - 2.000.000 đồng"], correct: 1, category: "Xử phạt vi phạm", explain: "Người điều khiển xe mô tô không chấp hành hiệu lệnh của biển báo cấm bị phạt từ 400.000 đến 600.000 đồng." },
            { id: 199, question: "Người điều khiển xe mô tô không bật đèn chiếu sáng phía sau khi trời tối bị phạt bao nhiêu tiền?", options: ["100.000 - 200.000 đồng", "200.000 - 400.000 đồng", "400.000 - 600.000 đồng", "600.000 - 1.000.000 đồng"], correct: 1, category: "Xử phạt vi phạm", explain: "Người điều khiển xe mô tô không bật đèn chiếu sáng phía sau khi trời tối bị phạt từ 200.000 đến 400.000 đồng." },
            { id: 200, question: "Người điều khiển xe mô tô chở người ngồi sau để chân đặt lên yên xe bị phạt bao nhiêu tiền?", options: ["100.000 - 200.000 đồng", "200.000 - 400.000 đồng", "400.000 - 600.000 đồng", "600.000 - 1.000.000 đồng"], correct: 1, category: "Xử phạt vi phạm", explain: "Người điều khiển xe mô tô chở người ngồi sau để chân đặt lên yên xe bị phạt từ 200.000 đến 400.000 đồng." },
            { id: 201, question: "Trước khi khởi động xe mô tô, người lái cần kiểm tra những gì?", options: ["Chỉ cần kiểm tra xăng", "Kiểm tra phanh, lốp, đèn, xăng, dầu", "Chỉ cần kiểm tra phanh", "Chỉ cần kiểm tra lốp"], correct: 1, category: "Kỹ thuật lái xe", explain: "Trước khi khởi động xe mô tô, người lái cần kiểm tra phanh, lốp, đèn chiếu sáng, xăng, dầu máy và các bộ phận quan trọng khác." },
            { id: 202, question: "Khi phanh xe mô tô, nên phanh bằng tay phanh trước hay chân phanh trước?", options: ["Phanh tay trước", "Phanh chân trước", "Phanh cả hai đồng thời, phanh chân trước nhẹ hơn", "Phanh bất kỳ bánh nào"], correct: 2, category: "Kỹ thuật lái xe", explain: "Khi phanh xe mô tô, nên phanh cả hai bánh đồng thời, trong đó chân phanh trước nhẹ hơn để tránh bánh trước bị khóa và trượt." },
            { id: 203, question: "Khi xe mô tô bị trượt nước (aquaplaning), người lái nên làm gì?", options: ["Phanh gấp", "Tăng tốc để thoát ra nhanh", "Giảm tốc độ từ từ và không đánh lái đột ngột", "Đánh lái mạnh để lấy lại cân bằng"], correct: 2, category: "Kỹ thuật lái xe", explain: "Khi xe mô tô bị trượt nước, người lái nên giảm tốc độ từ từ, không đánh lái đột ngột và giữ thăng bằng cho xe." },
            { id: 204, question: "Khoảng cách an toàn giữa hai xe mô tô khi đi cùng chiều là bao nhiêu?", options: ["1-2 giây", "2-3 giây", "3-4 giây", "4-5 giây"], correct: 1, category: "Kỹ thuật lái xe", explain: "Khoảng cách an toàn giữa hai xe mô tô khi đi cùng chiều nên là 2-3 giây để có đủ thời gian phản ứng khi tình huống bất ngờ xảy ra." },
            { id: 205, question: "Khi vào cua, kỹ thuật đánh lái đúng là gì?", options: ["Đánh lái mạnh và nhanh", "Đánh lái từ từ và giảm tốc độ trước khi vào cua", "Tăng tốc khi vào cua", "Không cần giảm tốc độ"], correct: 1, category: "Kỹ thuật lái xe", explain: "Khi vào cua, người lái xe mô tô nên giảm tốc độ trước khi vào cua và đánh lái từ từ, không nên tăng tốc hoặc đánh lái đột ngột." },
            { id: 206, question: "Tại sao không nên phanh gấp khi đang vào cua?", options: ["Vì tốn xăng", "Vì dễ làm bánh sau bị trượt và xe bị ngã", "Vì không có tác dụng", "Vì gây ồn"], correct: 1, category: "Kỹ thuật lái xe", explain: "Phanh gấp khi đang vào cua sẽ làm trọng lượng xe dồn về phía trước, khiến bánh sau dễ bị trượt và xe có thể bị ngã." },
            { id: 207, question: "Khi cần dừng xe đột ngột, kỹ thuật phanh nào là đúng?", options: ["Phanh gấp cả hai bánh cùng lúc", "Phanh chân trước mạnh nhất", "Phanh tay trước rồi đến phanh chân", "Phanh chân trước trước, sau đó phanh tay"], correct: 0, category: "Kỹ thuật lái xe", explain: "Khi cần dừng xe đột ngột, nên phanh gấp cả hai bánh cùng lúc với lực phanh phân bổ đều để xe dừng an toàn." },
            { id: 208, question: "Vị trí tay lái đúng khi điều khiển xe mô tô là ở đâu?", options: ["Hai tay nắm chặt vào đầu gạt gió", "Một tay nắm tay lái", "Hai tay đặt nhẹ nhàng trên tay lái, ngón tay không nên nắm quá chặt", "Tay phải nắm tay lái, tay trái thả lỏng"], correct: 2, category: "Kỹ thuật lái xe", explain: "Vị trí tay lái đúng là hai tay đặt nhẹ nhàng trên tay lái, ngón tay không nắm quá chặt để có thể điều khiển linh hoạt." },
            { id: 209, question: "Khi lái xe mô tô, tư thế ngồi đúng là gì?", options: ["Ngồi ngả về phía sau", "Ngồi thẳng, lưng thẳng, mắt nhìn về phía trước", "Ngồi khom lưng", "Ngồi nghiêng về một bên"], correct: 1, category: "Kỹ thuật lái xe", explain: "Khi lái xe mô tô, người lái nên ngồi thẳng, lưng thẳng, mắt nhìn về phía trước để quan sát tốt và giữ thăng bằng." },
            { id: 210, question: "Kỹ thuật khởi động xe mô tô trên dốc là gì?", options: ["Buông phanh đột ngột rồi tăng ga", "Giữ phanh, tăng ga từ từ rồi buông phanh", "Tăng ga trước rồi mới buông phanh", "Đẩy xe lên dốc rồi mới nổ máy"], correct: 1, category: "Kỹ thuật lái xe", explain: "Khi khởi động xe mô tô trên dốc, nên giữ phanh, tăng ga từ từ để không bị chết máy, sau đó buông phanh nhẹ nhàng." },
            { id: 211, question: "Khi thấy có hố trên đường, người lái xe mô tô nên xử lý như thế nào?", options: ["Đâm thẳng vào hố", "Giảm tốc độ và điều khiển xe tránh hố hoặc đi qua hố với tốc độ thấp", "Tăng tốc để nhảy qua hố", "Phanh gấp trước hố"], correct: 1, category: "Kỹ thuật lái xe", explain: "Khi thấy có hố trên đường, người lái xe mô tô nên giảm tốc độ và điều khiển xe tránh hố hoặc đi qua hố với tốc độ thấp để tránh bị ngã." },
            { id: 212, question: "Kỹ thuật vượt xe khác an toàn là gì?", options: ["Vượt bên phải với tốc độ cao", "Vượt bên trái, bật xi nhan, tăng tốc và đảm bảo đủ khoảng cách an toàn", "Vượt bất kỳ phía nào", "Bấm còi và vượt ngay"], correct: 1, category: "Kỹ thuật lái xe", explain: "Kỹ thuật vượt xe khác an toàn gồm: vượt bên trái, bật xi nhan báo hiệu, tăng tốc để vượt nhanh và đảm bảo đủ khoảng cách an toàn." },
            { id: 213, question: "Khi đi xe mô tô trên đường ướt, cần chú ý điều gì?", options: ["Tăng tốc để nhanh qua", "Giảm tốc độ, tăng khoảng cách an toàn với xe phía trước", "Phanh thường xuyên để kiểm tra phanh", "Đi sát vệ đường"], correct: 1, category: "Kỹ thuật lái xe", explain: "Khi đi xe mô tô trên đường ướt, người lái cần giảm tốc độ và tăng khoảng cách an toàn với xe phía trước vì đường trơn trượt." },
            { id: 214, question: "Tại sao khi đi xe mô tô cần đội mũ bảo hiểm đúng cách?", options: ["Để đẹp", "Để tránh bị phạt", "Để bảo vệ đầu khi xảy ra va chạm hoặc ngã xe", "Để nghe nhạc"], correct: 2, category: "Văn hóa giao thông", explain: "Mũ bảo hiểm đúng cách giúp bảo vệ đầu và giảm thiểu chấn thương nghiêm trọng khi xảy ra va chạm hoặc ngã xe." },
            { id: 215, question: "Hành vi nào sau đây là đúng khi tham gia giao thông?", options: ["Đi ngược chiều để đỡ kẹt xe", "Chấp hành đúng luật giao thông và nhường đường cho người đi bộ", "Bấm còi liên tục để thể hiện bực bội", "Vượt đèn đỏ khi đường vắng"], correct: 1, category: "Văn hóa giao thông", explain: "Hành vi đúng khi tham gia giao thông là chấp hành đúng luật giao thông, nhường đường cho người đi bộ và các phương tiện ưu tiên." },
            { id: 216, question: "Văn hóa giao thông là gì?", options: ["Trang phục đẹp khi đi xe", "Thái độ ứng xử có văn hóa, tuân thủ luật giao thông trong khi tham gia giao thông", "Lái xe nhanh", "Trang trí xe mô tô đẹp"], correct: 1, category: "Văn hóa giao thông", explain: "Văn hóa giao thông là thái độ ứng xử có văn hóa, tuân thủ luật giao thông và tôn trọng người tham gia giao thông khác." },
            { id: 217, question: "Khi gặp người đi bộ đang qua đường, người điều khiển xe mô tô nên làm gì?", options: ["Bấm còi để họ nhường đường", "Tăng tốc để qua nhanh", "Dừng lại và nhường đường cho người đi bộ", "Đi sát họ để gây áp lực"], correct: 2, category: "Văn hóa giao thông", explain: "Khi gặp người đi bộ đang qua đường, người điều khiển xe mô tô phải dừng lại và nhường đường cho người đi bộ." },
            { id: 218, question: "Hành vi nào sau đây thể hiện văn hóa giao thông tốt?", options: ["Đi xe lạng lách, đánh võng", "Nhường đường cho xe ưu tiên và người đi bộ", "Đỗ xe trên vỉa hè", "Sử dụng điện thoại khi lái xe"], correct: 1, category: "Văn hóa giao thông", explain: "Hành vi nhường đường cho xe ưu tiên và người đi bộ thể hiện văn hóa giao thông tốt và tôn trọng người tham gia giao thông khác." },
            { id: 219, question: "Tại sao không nên uống rượu bia khi điều khiển xe mô tô?", options: ["Vì tốn tiền", "Vì gây nghiện", "Vì rượu bia làm giảm khả năng tập trung và phản xạ, dễ gây tai nạn", "Vì không có lý do"], correct: 2, category: "Văn hóa giao thông", explain: "Rượu bia làm giảm khả năng tập trung, phản ứng chậm và suy giảm khả năng điều khiển xe, dễ gây tai nạn nghiêm trọng." },
            { id: 220, question: "Khi tham gia giao thông, người điều khiển xe mô tô cần có thái độ như thế nào?", options: ["Hung hăng, cửa quyền", "Bình tĩnh, nhẫn nại và có ý thức trách nhiệm với bản thân và người khác", "Vô tư, không quan tâm", "Sợ hãi, không dám đi"], correct: 1, category: "Văn hóa giao thông", explain: "Người điều khiển xe mô tô cần bình tĩnh, nhẫn nại, có ý thức trách nhiệm với bản thân và người tham gia giao thông khác." },
            { id: 221, question: "Khi đi xe mô tô trong khu dân cư, cần chú ý điều gì?", options: ["Chạy thật nhanh để về nhà sớm", "Giảm tốc độ, quan sát cẩn thận, nhường đường cho người đi bộ và trẻ em", "Bấm còi liên tục", "Đi xe lạng lách"], correct: 1, category: "Văn hóa giao thông", explain: "Khi đi xe mô tô trong khu dân cư, cần giảm tốc độ, quan sát cẩn thận và nhường đường cho người đi bộ và trẻ em." },
            { id: 222, question: "Người điều khiển xe mô tô có vai trò gì trong việc đảm bảo an toàn giao thông?", options: ["Không có vai trò gì", "Chỉ cần tuân thủ luật giao thông cho bản thân", "Có vai trò quan trọng trong việc chấp hành luật giao thông và lan tỏa ý thức văn hóa giao thông", "Chỉ cần đi xe cẩn thận"], correct: 2, category: "Văn hóa giao thông", explain: "Người điều khiển xe mô tô có vai trò quan trọng trong việc chấp hành luật giao thông và lan tỏa ý thức văn hóa giao thông đến cộng đồng." },
            { id: 223, question: "Khi thấy xe khác có hành vi vi phạm giao thông, người điều khiển xe mô tô nên làm gì?", options: ["Bấm còi, lạng lách để phản ứng", "Bình tĩnh, không phản ứng tiêu cực, tiếp tục chấp hành luật giao thông", "Đuổi theo để mắng mỏ", "Cố tình gây va chạm"], correct: 1, category: "Văn hóa giao thông", explain: "Khi thấy xe khác vi phạm giao thông, người điều khiển xe mô tô nên bình tĩnh, không phản ứng tiêu cực và tiếp tục chấp hành luật giao thông." },
            { id: 224, question: "Ý nghĩa của việc tuân thủ luật giao thông là gì?", options: ["Để không bị phạt", "Để đảm bảo an toàn cho bản thân và cộng đồng", "Để được khen thưởng", "Để được người khác nể trọng"], correct: 1, category: "Văn hóa giao thông", explain: "Việc tuân thủ luật giao thông giúp đảm bảo an toàn cho bản thân và cộng đồng, giảm thiểu tai nạn giao thông." },
            { id: 225, question: "Khi gặp xe ưu tiên đang làm nhiệm vụ, người điều khiển xe mô tô nên làm gì?", options: ["Cố gắng đi trước", "Dừng lại hoặc đi sát mép đường bên phải để nhường đường", "Bấm còi phản đối", "Tiếp tục đi bình thường"], correct: 1, category: "Văn hóa giao thông", explain: "Khi gặp xe ưu tiên đang làm nhiệm vụ, người điều khiển xe mô tô nên dừng lại hoặc đi sát mép đường bên phải để nhường đường." },
            { id: 226, question: "Tại sao không nên chở quá số người quy định trên xe mô tô?", options: ["Vì tốn xăng", "Vì xe có thể bị ngã, mất thăng bằng và gây nguy hiểm", "Vì không đẹp", "Vì không ai thấy"], correct: 1, category: "Văn hóa giao thông", explain: "Chở quá số người quy định sẽ làm xe mô tô mất thăng bằng, khó điều khiển và dễ gây tai nạn nguy hiểm." },
            { id: 227, question: "Hành vi nào thể hiện người lái xe mô tô có văn hóa?", options: ["Đỗ xe chiếm lề đường, vỉa hè", "Đội mũ bảo hiểm đúng cách, chấp hành luật giao thông, nhường đường cho người khác", "Chạy xe lạng lách, đánh võng", "Vượt đèn đỏ khi đường vắng"], correct: 1, category: "Văn hóa giao thông", explain: "Đội mũ bảo hiểm đúng cách, chấp hành luật giao thông và nhường đường cho người khác là những hành vi thể hiện văn hóa giao thông tốt." },
            { id: 228, question: "Khi đi xe mô tô gần trường học vào giờ tan học, cần chú ý điều gì?", options: ["Tăng tốc để nhanh qua", "Giảm tốc độ, quan sát cẩn thận, nhường đường cho trẻ em", "Bấm còi để trẻ em tránh ra", "Chạy xe ngang qua cổng trường"], correct: 1, category: "Văn hóa giao thông", explain: "Khi đi xe mô tô gần trường học vào giờ tan học, cần giảm tốc độ, quan sát cẩn thận và nhường đường cho trẻ em." },

        function loadProgress() {
            try {
                const saved = localStorage.getItem('traffic_practice_progress');
                if (saved) {
                    userProgress = JSON.parse(saved);
                    if (!userProgress.questions) userProgress.questions = {};
                    if (!userProgress.exams) userProgress.exams = {};
                }
            } catch (e) {
                console.error("Error loading progress", e);
            }
        }
        function saveProgress() {
            try {
                localStorage.setItem('traffic_practice_progress', JSON.stringify(userProgress));
            } catch (e) {
                console.error("Error saving progress", e);
            }
        }
        function trackQuestionAttempt(qId, isCorrect) {
            if (!userProgress.questions[qId]) {
                userProgress.questions[qId] = { correctCount: 0, wrongCount: 0 };
            }
            if (isCorrect) {
                userProgress.questions[qId].correctCount++;
                if (userProgress.questions[qId].wrongCount > 0) {
                    userProgress.questions[qId].wrongCount--;
                }
            } else {
                userProgress.questions[qId].wrongCount++;
            }
            saveProgress();
        }
        function trackExamAttempt(className, examNum, score, passed) {
            if (!userProgress.exams[className]) {
                userProgress.exams[className] = {};
            }
            if (!userProgress.exams[className][examNum]) {
                userProgress.exams[className][examNum] = { attempts: 0, passCount: 0, wrongCount: 0, lastScore: 0 };
            }
            const record = userProgress.exams[className][examNum];
            record.attempts++;
            if (passed) {
                record.passCount++;
            } else {
                record.wrongCount++;
            }
            record.lastScore = score;
            saveProgress();
        }
        function startWrongQuestionsPractice() {
            isMockExam = false;
            isTheoryMode = true;
            selectedCategory = 'Câu hay sai';
            currentQuestionIndex = 0;
            score = 0;
            const classQuestions = getQuestionsForClass(currentClass);
            filteredQuestions = classQuestions.filter(q => {
                const prog = userProgress.questions[q.id];
                return prog && prog.wrongCount > 0;
            });
            filteredQuestions.sort((a, b) => {
                const progA = userProgress.questions[a.id].wrongCount;
                const progB = userProgress.questions[b.id].wrongCount;
                return progB - progA;
            });
            if (filteredQuestions.length === 0) {
                alert("Chúc mừng! Bạn chưa trả lời sai câu hỏi nào.");
                return;
            }
            answers = Array(filteredQuestions.length).fill(undefined);
            renderQuiz();
        }
        function getQuestionsForClass(cls) {
            let baseFiltered = [];
            if (cls === 'A1') {
                baseFiltered = questions.filter(q => {
                    const text = q.question.toLowerCase();
                    if (q.category === 'Kỹ thuật lái xe') {
                        return text.includes('mô tô') || text.includes('xe máy') || text.includes('xe hai bánh') || text.includes('xe 2 bánh');
                    }
                    if (q.category === 'Luật giao thông' || q.category === 'Điểm liệt') {
                        if (text.includes('máy kéo') || text.includes('xe tải') || text.includes('đầu kéo') || text.includes('xe khách') || text.includes('hạng b2') || text.includes('hạng c') || text.includes('hộp số') || text.includes('niên hạn')) {
                            return false;
                        }
                    }
                    return true;
                });
            } else if (cls === 'A2') {
                baseFiltered = questions.filter(q => {
                    const text = q.question.toLowerCase();
                    if (q.category === 'Kỹ thuật lái xe') {
                        return text.includes('mô tô') || text.includes('xe máy') || text.includes('xe hai bánh') || text.includes('xe 2 bánh');
                    }
                    if (q.category === 'Luật giao thông' || q.category === 'Điểm liệt') {
                        if (text.includes('xe tải') || text.includes('đầu kéo') || text.includes('xe khách') || text.includes('số sàn') || text.includes('số tự động')) {
                            return false;
                        }
                    }
                    return true;
                });
            } else if (cls === 'A3') {
                baseFiltered = questions.filter(q => {
                    const text = q.question.toLowerCase();
                    if (q.category === 'Luật giao thông' || q.category === 'Điểm liệt') {
                        if (text.includes('xe tải') || text.includes('đầu kéo') || text.includes('xe khách') || text.includes('số sàn') || text.includes('số tự động')) {
                            return false;
                        }
                    }
                    return true;
                });
            } else if (cls === 'B1') {
                baseFiltered = questions.filter(q => {
                    const text = q.question.toLowerCase();
                    return !text.includes('số sàn') && !text.includes('xe tải') && !text.includes('hạng b2') && !text.includes('hạng c');
                });
            } else {
                baseFiltered = questions;
            }
            const config = classConfigs[cls] || classConfigs['A1'];
            const targetCount = config.officialTotal || 200;
            const expanded = [];
            for (let i = 0; i < targetCount; i++) {
                const baseQ = baseFiltered[i % baseFiltered.length];
                expanded.push({
                    ...baseQ,
                    id: i + 1,
                    baseId: baseQ.id
                });
            }
            return expanded;
        }

        // ===================== MOCK EXAM GENERATION =====================
        function generateMockExam(examIndex) {
            const config = classConfigs[currentClass] || classConfigs['A1'];
            const classQuestions = getQuestionsForClass(currentClass);
            const general = classQuestions.filter(q => q.category !== 'Biển báo giao thông' && q.category !== 'Sa hình' && q.category !== 'Điểm liệt');
            const signs = classQuestions.filter(q => q.category === 'Biển báo giao thông');
            const saHinh = classQuestions.filter(q => q.category === 'Sa hình');
            const diemLiet = classQuestions.filter(q => q.category === 'Điểm liệt');
            const examQuestions = [];
            const dlStep = Math.max(1, Math.floor(diemLiet.length / config.dl));
            for (let i = 0; i < config.dl && diemLiet.length > 0; i++) {
                const idx = (examIndex * 3 + i * dlStep) % diemLiet.length;
                examQuestions.push(diemLiet[idx]);
            }
            const genStep = Math.max(1, Math.floor(general.length / config.gen));
            for (let i = 0; i < config.gen && general.length > 0; i++) {
                const idx = (examIndex * 7 + i * genStep) % general.length;
                examQuestions.push(general[idx]);
            }
            const signStep = Math.max(1, Math.floor(signs.length / config.sign));
            for (let i = 0; i < config.sign && signs.length > 0; i++) {
                const idx = (examIndex * 13 + i * signStep) % signs.length;
                examQuestions.push(signs[idx]);
            }
            const shStep = Math.max(1, Math.floor(saHinh.length / config.sh));
            for (let i = 0; i < config.sh && saHinh.length > 0; i++) {
                const idx = (examIndex * 19 + i * shStep) % saHinh.length;
                examQuestions.push(saHinh[idx]);
            }
            const uniqueQuestions = [];
            const seenBaseIds = new Set();
            for (const q of examQuestions) {
                if (q && !seenBaseIds.has(q.baseId)) {
                    seenBaseIds.add(q.baseId);
                    uniqueQuestions.push(q);
                }
            }
            let fillIdx = 0;
            while (uniqueQuestions.length < config.total && general.length > 0) {
                const q = general[fillIdx % general.length];
                if (q && !seenBaseIds.has(q.baseId)) {
                    seenBaseIds.add(q.baseId);
                    uniqueQuestions.push(q);
                }
                fillIdx++;
            }
            return uniqueQuestions.slice(0, config.total);
        }
        function generateRandomMockExam() {
            const config = classConfigs[currentClass] || classConfigs['A1'];
            const classQuestions = getQuestionsForClass(currentClass);
            const general = shuffleArray(classQuestions.filter(q => q.category !== 'Biển báo giao thông' && q.category !== 'Sa hình' && q.category !== 'Điểm liệt'));
            const signs = shuffleArray(classQuestions.filter(q => q.category === 'Biển báo giao thông'));
            const saHinh = shuffleArray(classQuestions.filter(q => q.category === 'Sa hình'));
            const diemLiet = shuffleArray(classQuestions.filter(q => q.category === 'Điểm liệt'));
            const examQuestions = [];
            for (let i = 0; i < config.dl && diemLiet.length > 0; i++) examQuestions.push(diemLiet[i % diemLiet.length]);
            for (let i = 0; i < config.gen && general.length > 0; i++) examQuestions.push(general[i % general.length]);
            for (let i = 0; i < config.sign && signs.length > 0; i++) examQuestions.push(signs[i % signs.length]);
            for (let i = 0; i < config.sh && saHinh.length > 0; i++) examQuestions.push(saHinh[i % saHinh.length]);
            const uniqueQuestions = [];
            const seenBaseIds = new Set();
            for (const q of examQuestions) {
                if (q && !seenBaseIds.has(q.baseId)) {
                    seenBaseIds.add(q.baseId);
                    uniqueQuestions.push(q);
                }
            }
            let fillIdx = 0;
            while (uniqueQuestions.length < config.total && general.length > 0) {

                if (q && !seenBaseIds.has(q.baseId)) {
                    seenBaseIds.add(q.baseId);
